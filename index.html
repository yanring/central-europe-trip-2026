intro":"布达山上的林间散步道，连接草甸和吊椅缆车上站。","appearance":"宽而平整的林荫碎石路，沿途有长椅，树间草甸能坐下来休息。","highlights":["官方单程仅 2 公里、累计爬升 35 米，容易判断体力成本","森林、草甸和城市远景，与河岸城区很不一样"],"bestTime":"午后天气晴朗、能见度好时；日落前结束林间步行。","tradeoff":"优点是低爬升、可随时折返；缺点是往返城区耗时，阴雾天远景差，周末不一定安静。","booking":{"status":"步道无需预约","detail":"若选吊椅下山，出发前检查运营方当天公告；登塔当前不可用。","url":"https://normafapark.hu/turautvonalak/setany-gerincen"},"coordinates":{"lat":47.501485,"lng":18.969118,"sourceUrl":"https://normafapark.hu/turautvonalak/setany-gerincen"},"coordinateNote":"官方路线页面内嵌 GPX 的第一轨迹点；对应 Normafa 起点。","photo":{"url":"https://normafapark.hu/site/upload/images/nature/60b77054a75783efe1c76e596280025f.jpg","page":"https://normafapark.hu/turautvonalak/setany-gerincen","caption":"Normafa 官方山脊步道照片：林荫碎石路与休息椅","credit":"Normafa Park 官方网站，页面未标单独摄影者"},"trail":{"distance":"2 公里单程；原路往返约 4 公里","ascent":"35 米（官方单程累计爬升）","duration":"官方单程约 30 分钟；慢走拍照另加","difficulty":"官方难度 1，平缓易走","terrain":"稳定碎石铺面、路面较平整","routeType":"线形路线；可原路往返","note":"35 米与 30 分钟仅指官方单程，不是往返数据；返程累计爬升未核实。未包含登塔及缆车。"}},{"id":"bp-kopaszi","city":"布达佩斯","name":"Kopaszi-gát · 河湾公园慢走","kind":"风景","weather":"晴阴","time":"建议 1.5–2 小时","budget":"公园免费；饮食另付费","why":"想找一个能坐着聊天、沿水慢走的地方，这里比高密度古迹打卡更适合放空。","do":"沿 Lágymányos 河湾的步道走一段，挑湖湾边长椅坐下；愿意的话在公园餐饮点喝点东西，不把它当游泳或水上项目预约。","access":"位于布达南侧；可查看 Infopark、BudaPart 周边公交/电车，再步行进入公园。","hours":"运营方现有规则：4/15–10/15 为 06:00–02:00，10/16–4/14 为 06:00–22:00；这是 2023 版规则，到访以现场为准。","caution":"河边风凉；水上项目及沙滩另有经营季节，不因公园开放就默认可游泳。","refs":["outdoors-bp-kopaszi-0","outdoors-bp-kopaszi-1","outdoors-bp-kopaszi-2","outdoors-bp-kopaszi-3"],"map":"Kopaszi-gát Budapest","effort":"轻松","intro":"伸入河湾的狭长绿地，原有堤岸被改造为公共散步公园。","appearance":"树荫下的木质临水步道、草坪、平静河湾与对岸现代楼群。","highlights":["靠近水面散步，不必跨越很大的公园","可以把主要活动简化成聊天、看水与野餐式休息"],"bestTime":"晴天下午到傍晚；河边风大时体验会明显打折。","tradeoff":"优点是平坦、容易坐下休息；缺点是离老城较远，视野里有新楼，缺少经典地标，专程来需喜欢水边放空。","booking":{"status":"散步无需预约","detail":"运营规则注明普通公园访问免费；特定活动与餐饮另算。","url":"https://www.budapart.hu/assets/uploads/BUDAPART_POLICY_2023.pdf"},"coordinates":{"lat":47.46409,"lng":19.06205,"sourceUrl":"https://provertes.hu/vedett_teruletek_pdf/budapest/adatlap_4790.pdf"},"coordinateNote":"自然保护地调查页列出的园区 GPS 点；不是大门，导航时选择公园入口。","photo":{"url":"https://visithungary.com/media/e/ee/ee0d7cf2ef3b08d66bdba0ef13fa6593.jpg","page":"https://visithungary.com/articles/spring-activities-by-the-water-from-budapest-to-the-danube-bend","caption":"Kopaszi 河湾的临水步道；官方旅游文章封面标注为此地","credit":"Visit Hungary，页面未标单独摄影者"}},{"id":"bp-palvolgyi","city":"布达佩斯","name":"Pál-völgyi Cave · 地下洞穴探险","kind":"体验","weather":"雨天可用","time":"导览约 1 小时；建议连等候留 1.5–2 小时","budget":"官网成人普通票 3,900 HUF，出发前复核","why":"想要真正换一种体验而不是再看一栋楼，可跟着导览走进岩壁与晶体之间；不用参加需要匍匐爬行的专业洞探。","do":"参加约 500 米的已铺设洞穴导览；观察岩壁形状、钟乳石和方解石晶体。需爬 400 多级台阶及一段梯子。","access":"官方指引：从 Kolosy tér 乘 65 路，在 Pál-völgyi cseppkőbarlang 下；入口地址 Szépvölgyi út 162。","hours":"通常周二至周日，每小时 15 分发团，10:15–16:15；周一关闭（公共假日例外）。","caution":"全年约 11°C，带保暖衣、防滑鞋；普通讲解为匈牙利语，可下载英语语音导览。","refs":["outdoors-bp-palvolgyi-0"],"map":"Pál-völgyi Cave Budapest","effort":"台阶较多","intro":"布达丘陵地下的天然洞穴，可在固定导览中走已建设的参观段。","appearance":"狭窄高岩壁、起伏楼梯与暖色灯光；不是宽敞平路型展馆。","highlights":["能在城市范围内体验真正的地下地貌","下雨也能玩，体验与公园和古迹差异很大"],"bestTime":"雨天午后很合适；按导览发团时间到达，至少提前 10 分钟购票。","tradeoff":"优点是有探索感、天气影响小；缺点是台阶多、通道窄且低温，不适合膝盖不舒服或怕封闭空间的人。","booking":{"status":"普通团现场购票；英语私团需提前联系","detail":"普通团最多 35 人，满员需等下一团；至少提前 10 分钟买票。私人英语导览需至少提前 3 天联系且另收费。","url":"https://www.dunaipoly.hu/en/places/interpretation-sites/pal-volgyi-cave"},"coordinates":{"lat":47.53284,"lng":19.01613,"sourceUrl":"https://www.dunaipoly.hu/en/places/interpretation-sites/pal-volgyi-cave"},"coordinateNote":"国家公园官网嵌入地图的坐标，标示访客入口区域。","photo":{"url":"https://www.dunaipoly.hu/uploads/cache/default/uploads/2019-03/20190307142143-img-3550-1lbb6l72.jpg","page":"https://www.dunaipoly.hu/en/places/interpretation-sites/pal-volgyi-cave","caption":"Pál-völgyi 洞穴已建设参观段，可见真实通道宽度","credit":"Berentés Ágnes / Duna–Ipoly National Park"}},{"id":"bp-childrenrail","city":"布达佩斯","name":"Children’s Railway · 穿过森林的小火车","kind":"体验","weather":"晴阴","time":"全线单程约 40–50 分钟；建议连进山交通留半天","budget":"官网成人单程 1,000 HUF；两程票 1,800 HUF，怀旧列车另加费","why":"它是正常运行的窄轨铁路，售票、查票等工作由孩子参与完成；坐火车看森林，本身就很有趣，不限带小孩的家庭。","do":"从 Hűvösvölgy 或 Széchenyihegy 乘一段林间列车；先选体验，再决定是否中途下车。中途停留需选适合的票种。","access":"地图标 Hűvösvölgy 终点站，可乘市内交通到 Hűvösvölgy 后步行换乘；另一端是 Széchenyihegy，不是同一站。","hours":"官方 2026 年 9–10 月日历显示 9/28、10/5 周一停运；其他日期仍需打开对应时刻表。","caution":"不要误以为普通市内交通票通用。备福林现金；官方票价页不同段落对刷卡车站描述不一致。","refs":["outdoors-bp-childrenrail-0","outdoors-bp-childrenrail-1","outdoors-bp-childrenrail-2"],"map":"Hűvösvölgy Children’s Railway Station Budapest","effort":"轻松","intro":"穿行布达山林的窄轨铁路，由专业运营方管理，儿童参与乘务与站务。","appearance":"红白车厢、林间小站、穿制服的儿童乘务员；秋季树色以当时为准。","highlights":["坐着看森林，体力负担低","看孩子认真查票、发车，比单纯通勤更有故事感"],"bestTime":"白天至午后，提前看返程末班；不需要追早班。","tradeoff":"优点是有地方特色且适合慢节奏；缺点是进山耗时，视野多为林地，错过一班可能等很久；与 Normafa 可择一，也可之后再考虑串联。","booking":{"status":"普通散客现场买票，无需提前预约","detail":"官方写普通票不能提前购买；单程票不含中途下车再上车。怀旧列车另加费且不是每天有。","url":"https://gyermekvasut.hu/en/prices/"},"coordinates":{"lat":47.5414643,"lng":18.9639456,"sourceUrl":"https://maps.app.goo.gl/xeLhMHb2BUavPhZ7A"},"coordinateNote":"官网页脚 Google Maps 链接解析出的 Hűvösvölgy 车站地点坐标（非地图视图中心）。","photo":{"url":"https://gyermekvasut.hu/wp-content/uploads/2026/02/IMG_3485-min-1.jpg","page":"https://gyermekvasut.hu/en/home/","caption":"儿童铁路官方照片：林间车站与红白列车","credit":"MÁV / Children’s Railway 官方网站，页面未标单独摄影者"}},{"id":"vi-kahlenberg","city":"维也纳","name":"Kahlenberg · 葡萄园与森林环线","kind":"风景","weather":"晴阴","time":"完整环线步行 3.5–4 小时；含停留预留半天","budget":"步道免费；餐饮与登塔另计","why":"可以把葡萄园、森林和维也纳全景放在同一次户外活动里；比只坐车上观景台更有参与感。","do":"沿官方 City Hiking Path 1 从 Nußdorf 出发，走森林上山、经 Kahlenberg 再循葡萄园返回；酒馆只作为可选休息点。","access":"D 线电车 Nußdorf 终点站起步；想省力可另选 38A 巴士上山看景，但那不是本卡的完整徒步环线。","hours":"步道为户外路线；观景塔、酒馆各有营业时间。","caution":"雨后林地可能泥滑；晴天山顶仍可能有风。不要为了日落走到天黑才下山。","refs":["outdoors-vi-kahlenberg-0","outdoors-vi-kahlenberg-1"],"map":"Nußdorf Beethovengang tram D Vienna","effort":"中等","intro":"维也纳北侧的一条正式标记环线，穿过维也纳森林与葡萄坡，能远看多瑙河及城市。","appearance":"成排葡萄藤、树荫山路和开阔的城市天际线；沿路景观会从森林切换到坡地。","highlights":["沿葡萄园步道看城市与多瑙河，而不只在观景台拍一张照","山林徒步后在营业的 Heuriger 酒馆吃点东西"],"bestTime":"干燥、能见度好的上午出发；下午看景也合适，但完整环线要留够 4 小时以上。秋色随天气变化，不保证出行时全黄。","tradeoff":"完整 11 km 有持续爬坡，不是轻松饭后散步；如果只想坐下来喝咖啡，巴士上山更省力。","booking":{"status":"徒步无需预约","detail":"登塔与餐厅另查。酒馆并非沿途全部每天开门；周末指定餐馆可提前订位。","url":"https://www.wien.gv.at/en/leisure/hiking-path1"},"coordinates":{"lat":48.259742,"lng":16.3628405,"sourceUrl":"https://www.openstreetmap.org/way/164445559"},"coordinateNote":"图钉为 D 线 Nußdorf / Beethovengang 终点站，官方环线从这里开始，不是 Kahlenberg 山顶。","photo":{"url":"https://www.wien.info/resource/image/301968/3x2/520/346/f7e2657cd1707ca75615406639c044d/32591137FAE95BC14E0FC20DFB30749F/kahlenberg-wienerwald-wandern-wiener-hausberg-berg-wanderung-route-weinberge-weingaerten-ausblick-aussicht.webp","page":"https://www.wien.info/en/livable-vienna/parks-green-spaces/kahlenberg-337908","caption":"Kahlenberg 葡萄坡与山上的建筑，实景参考；照片不是当天叶色","credit":"© Österreich Werbung/Diejun"},"trail":{"distance":"11 km","ascent":"未核实（官方路线页未给累计爬升；484 m 是山顶海拔，不是爬升）","duration":"约 3.5–4 小时，未含长时间用餐","difficulty":"有持续上坡；官方未给难度等级","terrain":"葡萄园道路、林间步道与部分铺装路","routeType":"环线；Nußdorf 起终点"}},{"id":"vi-lainzer","city":"维也纳","name":"Lainzer Tiergarten · 森林与 Hermesvilla 轻松环线","kind":"风景","weather":"晴阴","time":"纯步行约 45 分钟；建议慢逛 1.5–2 小时","budget":"自然保护区免费；别墅室内另计","why":"适合想进森林、又不想爬一整座山的半日出游；树林、池塘和林中别墅在一条短线上。","do":"从 Lainzer Tor 游客中心出发，走官方自然环线到 Hermesvilla 外部花园，经 Hohenauer Teich 返回。","access":"官方指引：U4 Hietzing 换 56B 到 Lainzer Tor；市区往返交通需另留时间。","hours":"2026 年 9/28–10/11 园区 08:00–18:30；其他日期按园方季节表。Hermesvilla 室内独立开放。","caution":"闭园后不能进出；不喂野生动物，也不要把偶遇野猪或鹿当作保证。室内别墅可能季节关闭，此选项以户外为主。","refs":["outdoors-vi-lainzer-0","outdoors-vi-lainzer-1","outdoors-vi-lainzer-2","outdoors-vi-lainzer-3"],"map":"Lainzer Tor Vienna","effort":"轻松","intro":"原皇家猎场如今是自然保护区；这里推荐入口附近的短环线，不是走遍整个大森林。","appearance":"宽阔林间道路、草地池塘，以及树木包围的浅色尖顶别墅。","highlights":["沿维护好的林路慢走，停下看池塘和树木","看 Hermesvilla 外观与花园，不需要为展览专程买票"],"bestTime":"上午或下午较早时段；阴天也能看森林，雨后穿防滑鞋。秋叶时间取决于当季气温。","tradeoff":"位置偏西，往返交通可能比走路本身更久；短线看不到保护区所有远处观景点。","booking":{"status":"户外无需预约","detail":"园区免费开放；Hermesvilla 室内参观另查，不含在这条散步建议内。","url":"https://www.wien.gv.at/freizeit/lainzer-tiergarten-besucherinformationen"},"coordinates":{"lat":48.1669582,"lng":16.2570919,"sourceUrl":"https://www.openstreetmap.org/node/1017958980"},"coordinateNote":"图钉为 Lainzer Tor 入口，Hermesvilla 自然短环线从这一带开始，不是保护区中心。","photo":{"url":"https://www.wien.info/resource/image/299682/3x2/520/346/31f8010292189913ced0499821142924/300598D05823F3864F6CA09FDE30A35F/hermesvilla-park-garten.webp","page":"https://www.wien.info/en/see-do/families/outdoor/lainz-game-preserve-350650","caption":"Hermesvilla 与外部花园实景；本项不默认进入室内展览","credit":"© Österreich Werbung/Wilfried Gredler-Oxenbauer"},"trail":{"distance":"约 2.5 km","ascent":"未核实（官方未给累计爬升）","duration":"约 45 分钟纯步行","difficulty":"官方说明可无障碍通行的自然步道","terrain":"全程有维护的硬化路面","routeType":"环线；Lainzer Tor 游客中心起终点"}},{"id":"vi-stadtpark","city":"维也纳","name":"Stadtpark · 池塘、树影与金色施特劳斯","kind":"放空","weather":"晴阴","time":"45–90 分钟","budget":"公园散步免费；咖啡另计","why":"无需专门跑远，就能在市中心找一段真正舒服的绿地散步；池塘和河道比纯建筑打卡更放松。","do":"绕池塘慢走，看金色 Johann Strauss 雕像，再走到维也纳河与老地铁站外观；累了就找长椅坐。","access":"靠 Stadtpark / Wien Mitte 一带；可与市中心活动顺路，不必单独塞满半天。","hours":"公共公园户外散步；餐厅和设施各自营业。","caution":"雕像前可能有旅行团；公园不大，别预期荒野徒步或大片湖泊。","refs":["outdoors-vi-stadtpark-0","outdoors-vi-stadtpark-1"],"map":"Stadtpark Vienna Johann Strauss Monument","effort":"轻松","intro":"市中心的英式景观公园，有池塘、草坪、音乐家纪念像和穿园而过的维也纳河。","appearance":"树木环抱的小池塘、弯曲步道、金色小提琴家雕像和新艺术风格河道建筑。","highlights":["沿池塘找倒影、看水鸟，在长椅上休息","看金色施特劳斯与河道建筑，轻松获取很维也纳的画面"],"bestTime":"早上光线柔和、适合静静散步；傍晚也好。图中秋色仅供风貌参考，不保证具体日期叶色。","tradeoff":"方便、省力，但不属于值得单独坐长途车来看的壮观自然景点。","booking":{"status":"散步无需预约","detail":"公园本身无需订位；如果选园内餐厅，按餐厅要求预约。","url":"https://www.wien.info/de/lebenswertes-wien/parks-gruenflaechen/stadtpark-955832"},"coordinates":{"lat":48.203804,"lng":16.379166,"sourceUrl":"https://www.openstreetmap.org/node/262932599"},"coordinateNote":"图钉为 Johann Strauss 金色雕像，作为 Stadtpark 的散步参考点；公园有多个入口。","photo":{"url":"https://www.wien.info/resource/image/434732/3x2/520/346/5fdeff44d8bc64c2c0f29ceb9686262d/EFD37D6755A03A77BAFA449F5FE47594/51542-stadtpark.webp","page":"https://www.wien.info/de/lebenswertes-wien/parks-gruenflaechen/stadtpark-955832","caption":"Stadtpark 池塘与秋季树影实景","credit":"© WienTourismus/Julius Hirtzberger"}},{"id":"vi-augarten","city":"维也纳","name":"Augarten · 长林荫道与巨大防空塔","kind":"放空","weather":"晴阴","time":"1–1.5 小时","budget":"公园免费；餐饮另计","why":"长长的树列很适合两个人边走边聊；巨大混凝土防空塔与精致花园并置，比普通公园多一层特别的历史感。","do":"从 Augartenspitz 方向进入，沿林荫道慢走、看两座防空塔外观，再选草地或咖啡座休息。","access":"位于多瑙运河北侧第二区；地图标南端 Augartenspitz，便于判断与酒店距离。","hours":"官方常规表：9 月 06:30–20:00；10 月 06:30–19:00；临时关闭以园方为准。","caution":"防空塔不是可默认进入的观景楼；本项不含瓷器馆或音乐会。","refs":["outdoors-vi-augarten-0","outdoors-vi-augarten-1"],"map":"Augartenspitz Vienna","effort":"轻松","intro":"维也纳最古老的巴洛克花园，宽阔草坪和笔直树列中保留着二战防空塔。","appearance":"对称林荫大道、开阔草地，远处是一整块粗犷的灰色高塔。","highlights":["沿笔直树列散步，拍出很有纵深感的画面","近看防空塔外观与园林的强烈反差"],"bestTime":"下午到傍晚，树影有层次；出发前看当月闭园时间。是否已进入金黄秋色需看天气。","tradeoff":"不是华丽宫殿花园；如果不喜欢战争遗迹，塔楼可能觉得压抑，纯赏花也受季节影响。","booking":{"status":"公园无需预约","detail":"户外免费；园内演出、餐饮和瓷器相关活动另查，本项不包含。","url":"https://www.bundesgaerten.at/augarten/oeffnungszeiten.html"},"coordinates":{"lat":48.220282,"lng":16.3800575,"sourceUrl":"https://www.wien.info/de/lebenswertes-wien/parks-gruenflaechen/augarten-955840"},"coordinateNote":"坐标来自旅游局正文：公园南端 Augartenspitz 的城市地理中心参考点，非防空塔。","photo":{"url":"https://www.wien.info/resource/image/291696/3x2/520/346/3e7a7505f2debc3c761460b0c16e7754/C412015EFBB4AC78D77C5876D2B7E50B/50620-flakturm-im-augarten-allee-gruenes-wien-park-outdoor-sport.webp","page":"https://www.wien.info/de/lebenswertes-wien/parks-gruenflaechen/augarten-955840","caption":"Augarten 林荫道与防空塔实景；秋色不代表出行当天","credit":"© WienTourismus / Paul Bauer"}},{"id":"vi-old-danube","city":"维也纳","name":"Alte Donau · 湖边散步与双人小船","kind":"体验","weather":"晴天限定","time":"1.5–3 小时；租船可只选 30–60 分钟","budget":"岸边散步免费；船按每船计费。运营商网页现列 2025 价格，2026 需再确认","why":"想从看建筑切换成一起做点什么，这比普通游船更自由：自己划或开小电船，在水上慢慢看维也纳另一面。","do":"沿老多瑙河公共岸线散步；当天暖和、无大风且船行营业时，再选脚踏船或小电船。","access":"U1 Alte Donau 附近；参考租船点 Marina Hofbauer 位于 Wagramer Straße 49。","hours":"Marina Hofbauer 称一般 4 月至 10 月营业，但另页写季末视天气；9 月底/10 月必须先电话确认当天是否开。","caution":"不把夏季游泳场景当秋季保证。风大或冷雨天体验明显下降，船型与船位也需当天确认。","refs":["outdoors-vi-old-danube-0","outdoors-vi-old-danube-1","outdoors-vi-old-danube-2","outdoors-vi-old-danube-3"],"map":"Marina Hofbauer Wagramer Strasse 49 Vienna","effort":"轻松","intro":"老多瑙河是已与主河道分离的平静水域，湖畔有船屋、餐厅和租船点；不同于市中心的 Danube Canal。","appearance":"低矮岸边绿树与小码头，水上有小船，远处能看到现代城区。","highlights":["两人租小船，自选节奏看水面和城市天际线","不租船也能在公共岸段慢走，找水边餐厅休息"],"bestTime":"选暖和、少风的下午；秋季不要为了日落拖到停航或闭店后。只在确认营业后安排租船。","tradeoff":"旅游局宣传以夏天为主，秋季可能冷或停租；岸线有私人码头，不能假设处处都能通行。","booking":{"status":"散步无需预约；租船先确认","detail":"运营商未在已查页面明确常规船预约规则；想租指定船型先电话 +43 1 203 11 11 确认。网页要求带有照片的身份证件。","url":"https://marina-hofbauer.at/bootsvermietung/index.html"},"coordinates":{"lat":48.2377621,"lng":16.4256031,"sourceUrl":"https://www.openstreetmap.org/way/579497368"},"coordinateNote":"图钉为 Marina Hofbauer 租船点，只是一个具体上船参考点，不是湖中央。","photo":{"url":"https://www.wien.info/resource/image/291646/3x2/520/346/fabf1a3b85ef8ab9408da2798746886a/7436A44E4CADFF8F7F1318E6069E3155/50595-bootfahren-alte-donau-sommer-outdoor-wasser.webp","page":"https://www.wien.info/en/livable-vienna/water-in-vienna/summer-at-old-danube-360430","caption":"Alte Donau 小船实景，夏季拍摄；秋季是否开租取决于天气","credit":"© WienTourismus/Paul Bauer"}},{"id":"vi-central-cemetery","city":"维也纳","name":"Zentralfriedhof · 树荫大道与音乐家长眠地","kind":"风景","weather":"晴阴","time":"1.5–2 小时","budget":"户外步行免费；导览或馆内另计","why":"如果你们不排斥墓园，这里提供一种很特别的维也纳体验：安静的树荫大道、宏伟教堂，以及熟悉音乐家名字变成真实地点。","do":"从 Tor 2 主门进入，沿主轴看 Karl Borromäus 教堂，再在名人墓区找贝多芬、舒伯特等墓位；不必走遍全园。","access":"主入口 Tor 2 地址 Simmeringer Hauptstraße 234；不是老城中心，需给往返交通留时间。","hours":"园区 4–9 月 07:00–19:00；10/1–11/2 07:00–18:00。教堂 3 月至 11/2 通常至 16:30；侧门可能提早关闭。","caution":"仍是使用中的墓地，遇葬礼避让并保持安静；莫扎特这里只是纪念碑，不是他的安葬处。","refs":["outdoors-vi-central-cemetery-0","outdoors-vi-central-cemetery-1"],"map":"Zentralfriedhof Tor 2 Vienna","effort":"轻松","intro":"规模很大的城市墓园，也是林荫步道与新艺术风格建筑组成的安静绿地。","appearance":"笔直树荫大道通向浅色圆顶教堂，两侧分布石刻、墓碑与绿树。","highlights":["走主轴大道看圆顶教堂，感受不同于热闹老城的空间","在音乐家墓区认识名字和故事，不需要看艺术展"],"bestTime":"上午或下午较早时段；想进教堂需在 16:30 前留出时间，秋日树影好看但叶色随季节变化。","tradeoff":"气氛安静甚至肃穆，不是欢乐游乐项目；若对墓园不自在，直接跳过。园子很大，随意走容易超时。","booking":{"status":"自由散步无需预约","detail":"白天自行步行不必预约；夜间团和专门导览需另订，未纳入本项。","url":"https://www2.friedhoefewien.at/zentralfriedhof"},"coordinates":{"lat":48.1545672,"lng":16.4424241,"sourceUrl":"https://www.openstreetmap.org/node/9870495463"},"coordinateNote":"图钉标在 Tor 2 主入口附近，使用 OpenStreetMap 的同名参考点；不是范围很大的墓园中心。","photo":{"url":"https://www.wien.info/resource/image/291974/3x2/520/346/ca391ba7da868967f0b74d2dd576dbd/52DABAF6B8BF991CB137DD682A1C852B/50837-friedhof-zentralfriedhof-allee-friedhofskirche-kirche-zum-heiligen-karl-borromaeus-lueger-kirche.webp","page":"https://www.wien.info/de/sehen-erleben/sehenswuerdigkeiten-a-z/zentralfriedhof-366576","caption":"中央公墓主轴大道与 Karl Borromäus 教堂实景","credit":"© WienTourismus/Gregor Hofbauer"}},{"id":"lk-ewige","city":"湖区","name":"Ewige Wand · 森林、岩壁隧道与山谷全景","kind":"徒步","weather":"晴阴","time":"起点往返约 1.5–2 小时含拍照；上山接送另计","budget":"步道免费；预约出租车往返另询价","why":"想走一点山路又想有新鲜感时，比单纯湖边散步多了穿岩壁隧道的体验。","do":"从 Rathlucken Hütte 停车场沿传说步道走到岩壁与两条隧道，再原路返回。","access":"建议预约车到 Rathlucken Hütte 并约定接回，报价待询；官方说不用车到起点另需约 1.5 小时步行，公交只到山脚，不能把短步道当成酒店出门即到。","hours":"无固定检票时段；积雪较多时关闭。2026 页面仍列木雕更换警示，出发前看最新公告。","caution":"有树根、岩石和临崖段，栏索不等于封闭护栏；恐高、湿滑、冰雪天跳过，不进入同名攀岩线路。木雕维修期间别攀爬木雕。","refs":["outdoors-lk-ewige-0","outdoors-lk-ewige-1"],"map":"Rathlucken Hütte Bad Goisern","effort":"轻至中等（需接送）","intro":"Bad Goisern 上方贴着岩壁开的步道，先穿森林，再过两个短隧道，从崖边看山谷。","appearance":"灰白岩壁紧贴小路，隧道出口露出绿色山谷与远山，视角与在湖边完全不同。","highlights":["穿过岩壁中的两条隧道，近看石壁并俯瞰住宿地所在的山谷。","森林短走与开阔观景交替，适合拍照和小段徒步。"],"bestTime":"下午光线可照到面向山谷的岩壁；以干燥、能见度好为先，天黑前返回。","tradeoff":"最麻烦的是上到起点：叫车增加费用，自己上山则增加体力和时间；临崖段不适合明显恐高的人。","booking":{"status":"步道无需预约，接送需约","detail":"步道不收门票；提前预约往返出租车并确认最新开放，山屋用餐另查。","url":"https://dachstein.salzkammergut.at/en/oesterreich-tour/detail/430007280/bad-goisern-mountain-and-legend-trail.html"},"coordinates":{"lat":47.65297,"lng":13.6267,"sourceUrl":"https://dachstein.salzkammergut.at/en/oesterreich-poi/detail/430024646/parkplatz-rathlucken-huette.html"},"coordinateNote":"图钉在 Rathlucken Hütte 停车场步道起点，不在悬崖观景点。","trail":{"distance":"官方轨迹单程 1.1 km；正文约 1.5 km，往返按约 2.2–3 km 留量","ascent":"官方单程上升 116 m、下降 89 m；往返累计上升约 205 m（据同路折返估算）","duration":"官方单程 37 分钟；往返建议留 1.5–2 小时含停留","difficulty":"官方 easy；有临崖段，恐高需谨慎","terrain":"林间自然路面、树根、石块、岩壁通道与短隧道","routeType":"往返线，不含山脚到起点的接近路"},"photo":{"url":"https://assets.tourdata.at/x550/247458/FBAED0B82F26BF74D0A73B91803104C5AB892C84DF13E5C8224B284DEF9FC6F1/die-ewige-wand-ist-perfekt-um-die-sonne-bis-abends-zu-geniessen.jpg","page":"https://dachstein.salzkammergut.at/en/oesterreich-tour/detail/430007280/bad-goisern-mountain-and-legend-trail.html","caption":"Ewige Wand 岩壁步道实景","credit":"Best of Wandern Thomas Bichler"}},{"id":"lk-koppenwinkel","city":"湖区","name":"Koppenwinkel · 森林溪流与小湖环线","kind":"徒步","weather":"晴阴","time":"徒步含停留约 3–3.5 小时；交通另留余量","budget":"步道免费，往返火车另计","why":"不想上高山、又愿意认真走半天时，森林、溪流和岩壁盆地比再逛一个商业化小镇更合适。","do":"从 Obertraun Dachsteinhöhlen 站走官方环线，经过森林、Koppenwinkelsee 与牧场区域，再沿 Traun 河返回。","access":"Bad Goisern 乘火车到 Obertraun Dachsteinhöhlen，起终点同站，不必再约出租车；当天班次、票价和酒店接站时间另查。交通省接驳成本，但步行本身约 8.3 km。","hours":"官方列 5–10 月适合走；本次查看线路页未列封闭公告，不代表 9/30 或 10/1 保证开放，出发前复查。","caution":"不加入 Koppenbrüller 洞穴：原攻略记录其季节已于 9/27 结束。雨后注意湿滑；小湖水量季节变化大，可能水少，别只为蓝湖照片而来。","refs":["outdoors-lk-koppenwinkel-0","outdoors-lk-koppenwinkel-1"],"map":"Obertraun Dachsteinhöhlen Bahnhof","effort":"中等（距离较长、爬升少）","intro":"Obertraun 山脚的一条谷地环线，重点是林荫小路、清溪和陡峭山壁下的自然盆地。","appearance":"森林包住浅浅的小湖和溪流，背后是高耸岩壁；丰水与少水时会像不同的地方。","highlights":["比湖畔打卡更像在森林里走一趟，穿过溪流、牧场与林间小路。","从火车站出发又回到同一站，不依赖山顶缆车或停车场接送。"],"bestTime":"建议上午开始，下午不赶末班；阴天也能看森林和水，但大雨、暴涨或封闭时取消。","tradeoff":"全线 8.3 km 不是饭后小散步；小湖可能水少，部分路段视野在树林内，不是全程大山湖景。","booking":{"status":"无需预约","detail":"普通步道无需预约；列车、餐厅与任何洞穴项目分别确认。本卡不含洞穴入内。","url":"h 3888889,"sourceUrl":"https://badischl.salzkammergut.at/oesterreich-tour/detail/430002396/rundweg-ueber-den-jainzen-814-m.html"},"coordinateNote":"使用官方描述明确给出的起点 DMS 47°43′30″N、13°37′26″E；不是山顶。","trail":{"distance":"3.9 km（官方当前轨迹；不含车站接近路）","ascent":"累计上升 313 m、下降 313 m（官方当前轨迹）","duration":"官方 1 小时 54 分；含停留建议 2.5–3 小时","difficulty":"官方 medium；含辅助绳与陡坡","terrain":"柏油接近段、砾石林道和山径；下坡多折返","routeType":"环线，Jainzen 起点出发并返回"},"photo":{"url":"https://assets.tourdata.at/x550/242665/E59CA19C695D81E9D06B400FD60CA9B8F120678FAA709A5E53E0C0C008ADD4FE/ueber-den-jainzen.jpg","page":"https://badischl.salzkammergut.at/oesterreich-tour/detail/430002396/rundweg-ueber-den-jainzen-814-m.html","caption":"官方 Jainzen 徒步线路实景","credit":"www.badischl.at"}},{"id":"lk-kaiserpark","city":"湖区","name":"Kaiserpark · 皇帝别墅外的花园慢走","kind":"公园","weather":"晴阴","time":"1–1.5 小时","budget":"2026 成人仅公园 €6.70；不需买 €24 的别墅联票","why":"想看漂亮绿地、老树与别墅外观，又不爱艺术展时，只买公园票就能把重点放在户外。","do":"在花园和林荫路散步，看别墅外观与园林；不默认参观别墅房间或 Marmorschlössl 展览。","access":"Bad Goisern 乘火车到 Bad Ischl 后步行到 Jainzen 38；可与镇中心咖啡结合，不需要跨湖交通。","hours":"2026 年 9 月每天 09:30–17:00，10 月每天 10:00–16:00，公园同场馆时段。","caution":"园地有上坡，不是全园平坦无障碍；10 月关门比 9 月早一小时，别当全天公共公园。","refs":["outdoors-lk-kaiserpark-0","outdoors-lk-kaiserpark-1"],"map":"Kaiserpark Austria","effort":"轻松（可按体力缩短）","intro":"围绕 Kaiservilla 的收费历史园林，适合赏树、看建筑外观和散步；不需要对宫廷展览有兴趣。","appearance":"浅色别墅前是草坪、花圃与喷泉，往外走有大树和坡地林荫路径。","highlights":["只看室外也能享受别墅与花园同框，拍照后坐下休息。","比登山更好控制强度，适合当天不想走太久的选择。"],"bestTime":"建议上午至午后，光线柔和时看建筑与绿地；10 月尽量 14:30 前入园以免匆忙。","tradeoff":"需要门票，花园规模和“戏剧性”不如高山景观；如果只想免费坐树下，镇内公共公园也够用。","booking":{"status":"需门票，普通散客未见强制预约要求","detail":"成人仅公园票 €6.70；按门口售票及当天开放进入。官网线上主推别墅联票，不必为散步买更贵的室内导览。","url":"https://www.kaiservilla.at/index.php/de/oeffnungszeiten-und-preise"},"coordinates":{"lat":47.715020529241734,"lng":13.620761632919317,"sourceUrl":"https://badischl.salzkammergut.at/oesterreich-poi/detail/430002121/kaiservilla.html"},"coordinateNote":"图钉为官方 Kaiservilla 园区地点，不是公园每一扇入口；抵达后找售票入口。","photo":{"url":"https://assets.tourdata.at/x550/209309/895F7144B4D5EFCB87CC0A67281675E646D89D88BB86E94D3FB4059C44CA2F3B/kaiservilla-bad-ischl.jpg","page":"https://badischl.salzkammergut.at/oesterreich-poi/detail/430002121/kaiservilla.html","caption":"Kaiservilla 与园林外观实景（广角全景照片）","credit":"Oberösterreich Tourismus/Steininger"}},{"id":"lk-katrin","city":"湖区","name":"Katrin · 复古小缆车与山上看景","kind":"体验","weather":"晴天限定","time":"山上及缆车约 2–3 小时；门到门按半天以上留量","budget":"2026 成人缆车往返 €28；餐饮、火车及公交另计","why":"想上山看远景，又不想完成登顶长线时，小缆车本身就有趣；可以只在上站周围看景、喝东西。","do":"坐约 15 分钟缆车到约 1,400 米高处，在开放的上站周边停留看山；体力好再现场挑短路，不默认加七湖环线或攀岩。","access":"先火车到 Bad Ischl，工作日可接 552 到 Kaltenbach-Katrinseilbahn；官方称周末及节假日无此市区公交。镇中心步行到下站约 30 分钟，可省公交等待但多走路。","hours":"2026 夏季至 11/9，每天 09:00–17:00；末班上行 16:30、下行 17:00。天气或运营可能临时变动。","caution":"山顶低云时上去可能只看雾；上站附近也会冷和有坡度。不要把海拔 1,400 米写成徒步爬升，也不把完整七湖环线当平坦散步。","refs":["outdoors-lk-katrin-0","outdoors-lk-katrin-1","outdoors-lk-katrin-2","outdoors-lk-katrin-3"],"map":"Katrin Austria","effort":"轻至中等（仅上站周边）","intro":"从 Bad Ischl 山脚乘小型复古缆车上 Katrin，以乘坐体验、高山空气和远景为主。","appearance":"小车厢沿林坡上升，山上视线越过草坡与树林望向层叠群山；不同位置能看到不同方向的湖和山。","highlights":["慢慢升高的缆车让景色逐步展开，本身就是值得体验的一段。","不必挑战登顶，也能在上站周围欣赏山景并安排山上休息。"],"bestTime":"上午先看实时山顶天气再决定；能见度比日落更重要，提前于末班下山。","tradeoff":"比免费步道花钱；云雾、风或停运都会影响价值，公交与缆车要衔接。若已选 Krippenstein，可把它当替代而非两座山都上。","booking":{"status":"需缆车票","detail":"可按官方售票渠道购票；普通乘坐未见强制时段预约要求。先看天气与当天运营，再决定上山。","url":"https://en.katrinseilbahn.com/tarife"},"coordinates":{"lat":47.698333333,"lng":13.6075,"sourceUrl":"https://en.katrinseilbahn.com/kontakt-anfahrt"},"coordinateNote":"图钉为下站（官方 DMS 坐标），实际观景在乘缆车抵达的上站；图上直线距离不是步行到山顶距离。","photo":{"url":"https://images.squarespace-cdn.com/content/v1/5fbb908d3c97a8499ab47dfb/1c26e47f-dbf9-40d6-9dca-044760e2c32c/katrinseilbahn-aussicht%C2%A9bettinagangl002.jpg","page":"https://en.katrinseilbahn.com/","caption":"Katrin 缆车官方山景实景；非保证上站每处都有同一视角","credit":"Bettina Gangl / Katrin Seilbahn"}},{"id":"pr-stromovka","name":"Stromovka · 池塘、草坪与大树下散步","kind":"风景","weather":"晴阴","time":"1.5–2.5 小时（建议停留）","budget":"公园散步免费，餐饮另计","intro":"由王室猎场改成的大型城市公园；核心是湖塘、草地和成熟树木，适合没有打卡任务地慢慢走。","appearance":"弯曲池岸倒映大树，宽阔草坪与林荫路交替；不是俯瞰老城的高处观景台。","highlights":["围着湖塘走一段，看水面倒影和水鸟","带一点点心坐长椅，或沿林荫道继续走"],"why":"想要轻松散步时值得优先挑：相较城堡区和山坡花园，中央池塘区更适合少爬坡、边走边休息。","do":"从方便的入口到中央池塘区，自选一小圈；只想歇脚就停在湖边，不必把整座公园走遍。","access":"在布拉格北部、Výstaviště 展览园旁；公共交通到入口后仍需步行。与现有 Výstaviště Kolkovna 餐厅属于同一方向。","hours":"公共城市公园；未查到统一每日关门时刻，建议白天游览。","caution":"秋色取决于天气，9 月底、10 月初不保证满园金黄；雨后草地可能湿软。","map":"Královská obora Stromovka Prague","effort":"中央池塘区较轻松","bestTime":"有日光的上午或午后；晴天看倒影、阴天走林荫都合适，野餐则挑温暖少风的时候。","tradeoff":"放松价值高，但没有密集历史地标或标志性河桥全景；若你们只想拍经典布拉格，Letná 更直接。","booking":{"status":"无需预约","detail":"公共公园不需要预约；餐厅和其他付费活动各自另算。","url":"https://prague.eu/cs/objevujte/kralovska-obora-stromovka/"},"city":"布拉格","refs":["outdoors-pr-stromovka-0"],"coordinates":{"lat":50.106494451475,"lng":14.419288404199,"sourceUrl":"https://prague.eu/cs/objevujte/kralovska-obora-stromovka/"},"coordinateNote":"旅游局页面的官方导航点，用于判断所在区域；大型公园不是唯一入口。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13095400/stromovka2-scaled-e1730720562378.jpg","page":"https://prague.eu/cs/objevujte/kralovska-obora-stromovka/","caption":"Stromovka 的池塘、草坪与树木倒影；秋叶颜色随天气变化","credit":"Prague City Tourism"}},{"id":"pr-divoka-sarka","name":"Divoká Šárka · 坐电车就能到的岩谷散步","kind":"徒步","weather":"晴阴","time":"2–3 小时（短程往返的建议预留，不含交通）","budget":"自然保护区步道免费","intro":"布拉格西北的岩石峡谷与自然保护区，溪流穿过岩壁、树林和草地；比整齐城市公园更有走进自然的感觉。","appearance":"灰色岩壁从林间突起，谷底有溪流与步道；主图是高处看谷地，不代表短线会登上这个拍摄点。","highlights":["沿标记步道进谷，近看岩壁和溪流","走累就原路返回，不必为登顶离开正规步道"],"why":"若这次想给老城街景换一种体验，这是布拉格候选里最像小型自然徒步的一项，公共交通也能接近。","do":"从 Divoká Šárka 电车站附近进谷，优先沿红色标记的溪谷步道走一段再折返；看地图和剩余体力决定折返点，暂不指定山脊环线。","access":"乘电车到 Divoká Šárka，再按官方导览图找谷口；电车站不是所有线路的终点，查实时交通即可。","hours":"自然步道只建议白天走，天黑前出谷；沿途夏季泳池不作为这次秋游内容。","caution":"路面有坡和不平整处，雨后湿滑；穿有抓地力的鞋。不以高处宣传照片为由走到悬崖边或未标记小径。","map":"Divoká Šárka tram stop Prague","effort":"轻至中等，按折返点调整","bestTime":"选干燥天气的上午到早下午，给往返和停留留足白天；阴天也可看峡谷，不推荐天黑才入谷。","tradeoff":"自然感比城市公园强，但往返更花时间，休息和补给没有市中心密集；如果只想平路闲逛，选 Stromovka 更合适。","booking":{"status":"无需预约","detail":"自然保护区标记步道自由进入；遵守现场封路与保护区规定。","url":"https://prague.eu/cs/objevujte/divoka-sarka/"},"city":"布拉格","refs":["outdoors-pr-divoka-sarka-0","outdoors-pr-divoka-sarka-1"],"coordinates":{"lat":50.0926979,"lng":14.3226889,"sourceUrl":"https://www.openstreetmap.org/node/11282180218"},"coordinateNote":"图钉为 Divoká Šárka 电车停靠点，入谷后沿红色标记步道走；不是岩顶观景机位。具体入口跟随现场步道标识。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13075523/divoka-sarka.jpg","page":"https://prague.eu/cs/objevujte/divoka-sarka/","caption":"Divoká Šárka 的岩壁与林谷；这是高处视角，推荐谷底短线不保证同款视野","credit":"Prague City Tourism"},"trail":{"distance":"按折返点决定，短线总里程尚未测定","ascent":"累计爬升尚未核实","duration":"建议预留 2–3 小时；不是官方定长路线用时","difficulty":"谷底短线较轻松，有坡和不平整路面；不含岩顶线路","terrain":"沿溪标记步道，部分硬化路及自然路面","routeType":"往返，可随时提前折返","note":"市政府资料推荐从电车站沿红色步道入溪谷；本候选仅取一段往返，不把保护区约 2 km 长度或另一条 9.3 km 全线当成此路线里程。选中后再定折返点、测距与爬升。"}},{"id":"pr-petrin","name":"Petřín 山坡花园 · 果树间看红屋顶","kind":"风景","weather":"晴阴","time":"1.5–3 小时（建议停留，登塔另计）","budget":"公共花园免费；缆车、登塔和镜宫另购票","intro":"Strahov 与小城区之间连成片的山坡花园，串着果树林、长椅和能看城市的园路，不登塔也能散步。","appearance":"草坡上散布果树，树间露出城堡和红屋顶；山顶还有铁塔与花园，秋季不要按春天满树开花来期待。","highlights":["沿 Seminary Garden 一带的果树林园路，看屋顶与城堡","想加一点趣味可另选缆车或镜宫，不必把所有付费项目都买齐"],"why":"你们住 Strahov 附近，这片绿地更容易与住宿周边一起考虑；是“散步本身就有景”的候选。","do":"先挑一个方向走花园和果树林，看到喜欢的长椅就停；如想省上坡再考虑缆车，登塔和镜宫以后单独取舍。","access":"从 Lindner 所在 Strahov 区可步行接山顶园区，再按体力选是否下到小城区；若从 Újezd 上山，缆车也可作为付费选项。","hours":"花园建议白天游览。PID 列缆车每日 07:00–22:15、约 10 分钟一班；2026-09-22 起恢复载客试运营，临行查即时状态。","caution":"有持续坡道，下坡也会累；恢复运营初期仍应查缆车状态。园内并非所有花园都开放，例如使馆所属 Lobkowicz 花园不可自由进入。","map":"Petřín Gardens Prague","effort":"有明显坡度，可只走上部园区","bestTime":"能见度好的午后到日落前，留时间走出园区；如果只走树下小路，不必为了所谓最佳光线特意等日落。","tradeoff":"比平地公园多坡、走完整山很费腿；部分经典全景来自付费登塔，花园散步不等于拥有塔顶 360° 视野。","booking":{"status":"花园无需预约","detail":"缆车另购票，PID 当前列单程 100 CZK；不是所有普通交通票都适用。登塔、镜宫票种另查。","url":"https://pid.cz/en/funicular/"},"city":"布拉格","refs":["outdoors-pr-petrin-0","outdoors-pr-petrin-1","outdoors-pr-petrin-2"],"coordinates":{"lat":50.082931915424,"lng":14.398217936865,"sourceUrl":"https://prague.eu/en/objevujte/petrin-gardens-petrinske-sady/"},"coordinateNote":"旅游局页面的官方导航点，用于判断所在区域；大型公园不是唯一入口。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/14103810/jpgtif_dsc1033.jpg","page":"https://prague.eu/en/objevujte/petrin-gardens-petrinske-sady/","caption":"Petřín 山坡果树与园路，远处是布拉格城堡","credit":"Prague City Tourism"}},{"id":"pr-waldstein","name":"Waldstein 花园 · 孔雀、倒影与奇怪的岩洞墙","kind":"风景","weather":"晴阴","time":"45–75 分钟（建议停留）","budget":"免费","intro":"小城区宫殿旁的封闭式巴洛克花园，把整齐绿篱、池塘、巨大拱廊与人工钟乳石墙装在一个不大的空间里。","appearance":"对称绿篱通向三联高拱廊，一侧是造型怪异的灰色岩洞墙；园内可遇见孔雀，但不保证靠近或开屏。","highlights":["沿池塘和绿篱看建筑倒影、拱廊与雕塑","找人工岩洞墙里的细节，远距离观察孔雀"],"why":"不用懂艺术史也能直接觉得好看、有点古怪；适合给小城区散步加一段短而有变化的花园休息。","do":"绕池塘与主花坛，走到岩洞墙前看纹理，再找长椅坐一会儿；不需要进宫殿或参加展览。","access":"靠 Malostranská 地铁站和电车站；从酒店方向到小城区后可步行进入，注意围墙入口位置。","hours":"参议院官网：4 月 1 日至 10 月 31 日开放；周一至周五 07:00–19:00，周末及节假日 09:00–19:00。","caution":"不要走进草坪、投喂或触摸动物；不保证见到孔雀开屏。临时官方活动可能影响入园，以现场为准。","map":"Wallenstein Garden Prague","effort":"轻松短走","bestTime":"上午开放后或下午有日光时；秋天早晚较凉，想坐久一点可挑午后，不必赶拍夕阳。","tradeoff":"精致但面积不大，不适合期待长距离徒步的人；周边热门，安静程度随人流变化，11 月起常规季节关闭。","booking":{"status":"无需预约","detail":"常规花园参观免费，依季节和开放时间入园；宫殿内部不是这项花园散步的内容。","url":"https://www.senat.cz/informace/pro_verejnost/valdstejnska_zahrada/index.php"},"city":"布拉格","refs":["outdoors-pr-waldstein-0","outdoors-pr-waldstein-1"],"coordinates":{"lat":50.090236437208,"lng":14.407702663477,"sourceUrl":"https://prague.eu/en/objevujte/wallenstein-garden-valdstejnska-zahrada/"},"coordinateNote":"图钉为旅游局给出的花园位置，具体开放入口以当日现场标识为准。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13094759/valdstejnska-zahrada-scaled.jpg","page":"https://prague.eu/en/objevujte/wallenstein-garden-valdstejnska-zahrada/","caption":"Waldstein 花园的几何绿篱、雕像与高拱廊","credit":"Prague City Tourism"}},{"id":"pr-troja-botanical","name":"Troja 植物园 · 日本园、葡萄坡与热带温室","kind":"风景","weather":"晴阴","time":"2.5–4 小时（建议停留）","budget":"需购票，按官网当日票种；园内餐饮另计","intro":"Troja 山坡上的大植物园，既有日本园与葡萄园，也有不同气候植物区和 Fata Morgana 热带温室。","appearance":"室外是小径、树木和顺坡排列的葡萄藤；温室里变成繁密叶片、岩壁与水景，走起来像换了一个气候。","highlights":["在日本园与室外植物区慢走，再看圣克拉拉葡萄坡视野","愿意多逛时加 Fata Morgana 温室，看热带植物与水景"],"why":"比单纯坐公园多一点探索感，又无需看展解说；适合想把自然、花园和有趣室内体验放在同一次出门的人。","do":"在室外区选日本园、葡萄园与一段园路；温室作为可加项目，别为“票都买了”强行走遍所有分区。","access":"官方列从 Nádraží Holešovice 换公交到 Troja 一带；园区有多个入口，先决定室外区还是温室再选入口，二者不是同一个门。","hours":"官网列 3–10 月室外区每日 09:00–19:00；Fata Morgana 周二至周日及假日 09:00–19:00，周一闭馆，末次入温室 18:30。","caution":"日本园曾有 2026-09-23–25 拍摄限制，不等于 10 月也关闭；出发前复查当日公告。园区有坡，秋色和花量随季节变化。","map":"Prague Botanical Garden Troja","effort":"园区大且有坡，可缩短","bestTime":"建议上午后段开始，给室外区和温室留足时间；晴天先看葡萄坡，小雨可把重心放在温室，不能当全程室内。","tradeoff":"需门票且离酒店较远，走全部区域会累；若只是想散步一小时，免费公园更省事；10 月不应期待春季花海。","booking":{"status":"需购票，普通参观通常无需预约时段","detail":"可从官网查看门票并线上购买；是否包含温室按实际票种确认，特别活动与导览另算。","url":"https://www.botanicka.cz/en/for-visitors/basic-info/entrance-fees"},"city":"布拉格","refs":["outdoors-pr-troja-botanical-0","outdoors-pr-troja-botanical-1","outdoors-pr-troja-botanical-2","outdoors-pr-troja-botanical-3"],"coordinates":{"lat":50.12424118818707,"lng":14.419494797354377,"sourceUrl":"https://www.botanicka.cz/en/for-visitors/basic-info/how-to-get-to-us"},"coordinateNote":"植物园官网交通页给出的园区 GPS；请按已选分区另选具体入口，不能直接当温室门口。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13094022/bz-fata-sukulentni-m.jpg","page":"https://prague.eu/cs/objevujte/botanicka-zahrada-hl-m-prahy-sklenik-fata-morgana/","caption":"Fata Morgana 温室里的植物与步道；不是室外日本园照片","credit":"Prague City Tourism"}},{"id":"pr-naplavka","name":"Náplavka 河岸 · 买点吃的，坐在水边看船","kind":"体验","weather":"晴阴","time":"1–2 小时（建议停留）","budget":"河岸和市集免费，吃喝另计","intro":"Rašínovo 河岸下层的步行空间，沿着伏尔塔瓦河看船、坐一会儿；周六早上还有农夫市集。","appearance":"石铺河堤紧贴水面，一边是停泊的船、一边是沿岸老楼；市集日有连续摊位与端着食物聊天的人。","highlights":["沿水边走走看船，买一杯饮品坐下来","周六上午可逛面包、奶酪和当季食物摊位"],"why":"如果你们喜欢把旅行当成散步和吃东西，这里有很直接的生活气氛；比只在桥上拍照多了停下来消磨时间的理由。","do":"先走一段河岸再按胃口买一点食物；若不逛市集，选好天气坐水边也成立，不用把它包装成必到地标。","access":"位于新城南部河岸、Palackého 广场至铁路桥一带；要下到低层河岸，留意入口坡道或台阶。","hours":"市集官方列 2–12 rtier 附近吃饭。","access":"MuseumsQuartier，与 Neubau 方向衔接。","hours":"通常周二关闭，其余 10:00–18:00。","caution":"替代半天，不是在原路线后额外加 3 小时。特展和票价下单时核对。","refs":["leopold"],"map":"Leopold Museum Vienna","effort":"轻松","intro":"以席勒、克里姆特和维也纳 1900 年前后艺术为重点的博物馆，保留为有明确兴趣时的雨天备选。","appearance":"MuseumsQuartier 内浅色石材的方盒子建筑，内部为现代展厅。","highlights":["只挑真正想看的席勒或克里姆特作品","看完后在 MuseumsQuartier 附近休息"],"bestTime":"下雨且确实想看这类画时再选；官网通常周一 10:00–18:00 开放，周二闭馆。","tradeoff":"需要门票和持续看展的兴趣；你们不太爱艺术展，优先级低于街区、花园和咖啡体验。","photo":{"url":"https://www.leopoldmuseum.org/media/image/c950x576/5365.jpg","page":"https://www.leopoldmuseum.org/en/visit/opening-hours","caption":"Leopold Museum 外观，屋顶为 MQ Libelle","credit":"Leopold Museum, Wien / Ouriel Morgensztern"},"booking":{"status":"需购票，可提前买","detail":"普通参观需要门票；不是必须提前预约的承诺。先确认当天开放和想看的展区。","url":"https://www.leopoldmuseum.org/en/visit/tickets"},"coordinates":{"lat":48.2025896,"lng":16.3590667,"sourceUrl":"https://www.openstreetmap.org/way/20411606","label":"Leopold Museum, 1, Museumsplatz, Sankt Ulrich, Spittelberg, Katastralgemeinde Neubau, Neubau, Wien, 1070, Österreich"}},{"id":"lk-gosau","city":"湖区","name":"Vorderer Gosausee · 开放湖岸慢走","kind":"风景","weather":"晴阴","time":"在湖边 2–3 小时，门到门约 5–7 小时","budget":"湖岸免费；公交/出租车与午餐另计","why":"这趟最值得留给好天气的自然景观之一；但它本身知名，不承诺无人。","do":"默认只沿确认开放的右岸往返，找开阔位置看山和湖；不强制绕一圈，更不延伸后湖长线。","access":"先到 Steeg-Gosau，再接 542 向 Hintertal b.Gosau Gosausee。部分旧页写从 Bad Goisern 直达，不能据此假设无需换乘。也可提前询价出租车往返。","hours":"官网提示左岸 8/22–9/30 因落石关闭；10/1 是否恢复仍须当天确认。","caution":"最新封闭提示优先于旧版 4.2 公里环湖介绍。雨大、有新落石警报就不去；不越围挡。","refs":["gosau","gosauloop","ooevv","bus542"],"map":"Vorderer Gosausee Austria","effort":"中等","intro":"一座被森林和岩壁围住的高山湖，抬头能看见 Dachstein 山体与冰川；主要体验就是沿湖走、看山和拍照。","appearance":"蓝绿湖水前是针叶林，两侧岩壁把视线引向远处山峰。无风时会有倒影；秋季水位与照片可能不同。","highlights":["沿确认开放的湖岸找山峰与湖水同框的位置，坐下来慢慢看。","不用爬到山顶，也能在湖边感受高山与冰川景观。"],"bestTime":"建议留给能见度好的上午至午后，先查封闭与天气；比追日出日落更适合这次公共交通出行。","tradeoff":"景色最依赖天气，往返接驳耗时；阴雨、落石警报或湖岸封闭时收益明显下降。","photo":{"url":"https://assets.tourdata.at/x550/201074/74992249E5FF8F43250CB9735F5FE1188F31D9C81D913D0CF3BAF3AF2EA0265D/gosausee-mit-blick-auf-den-dachstein.jpg","page":"https://www.salzkammergut.at/en/search-accommodation/oesterreich-poi/detail/201041/lake-gosau.html","caption":"前 Gosausee 与 Dachstein 山景","credit":"RudiKainPhotografie"},"coordinates":{"lat":47.529372434,"lng":13.504343033,"sourceUrl":"https://www.salzkammergut.at/en/search-accommodation/oesterreich-poi/detail/201041/lake-gosau.html"},"booking":{"status":"无需预约","detail":"只在公共开放湖岸散步，无需预约；接驳车另约。先确认封闭公告，不能把预约与步道开放混为一谈。","url":"https://www.salzkammergut.at/en/search-accommodation/oesterreich-poi/detail/201041/lake-gosau.html"}},{"id":"lk-untersee","city":"湖区","name":"Untersee · 不去 Hallstatt 村的湖岸","kind":"风景","weather":"晴阴","time":"2–3 小时","budget":"散步免费，交通另计","why":"同一片山湖景观，却不把人流最密集的村中心作为目的地。","do":"在公共湖岸慢走、坐一会儿，按天气短程往返；不把私人草地、船屋当作可进入的景点。","access":"Steeg-Gosau 火车站往公共湖岸官方参考约 25 分钟步行；打车更省往返体力。","hours":"白天、天气适合时前往；不是安排秋季游泳。","caution":"接 Steegwirt 可以，但还需核对餐厅与湖岸之间的步行或车辆，不是同一个门口。","refs":["untersee","visual-lk-untersee-0"],"map":"Untersee Bad Goisern","effort":"轻松","intro":"Hallstättersee 北端、Bad Goisern 一侧的公共湖岸。来这里是坐看湖面与山谷，不是逛 Hallstatt 村。","appearance":"草地与低矮湖岸接着开阔水面，远处是两岸陡山和 Krippenstein；没有 Hallstatt 村那排贴山老房子。","highlights":["在公共湖岸短走、坐着看水和远山，拍一张开阔山湖照。","适合想看湖、又不想安排长线徒步的半天。"],"bestTime":"建议白天雨停、能看清对岸山体时去；秋季以散步为主，配图为夏季实景，不代表游泳设施当日开放。","tradeoff":"景观变化比 Gosausee 少，附近私有草地和船屋不能随意进入；与 Steegwirt 之间仍要安排移动。","photo":{"url":"https://assets.tourdata.at/x550/200456/483A426B935524333F1185733610A981445C8FDCF7BDCCE1CAA49FB65C697CAE/strandbad-untersee-in-bad-goisern.jpg","page":"https://dachstein.salzkammergut.at/oesterreich-poi/detail/200188/strandbad-untersee.html","caption":"Untersee 公共湖岸，夏季实景","credit":"Torsten Kraft"},"coordinates":{"lat":47.60847775345513,"lng":13.646306991577148,"sourceUrl":"https://dachstein.salzkammergut.at/oesterreich-poi/detail/200188/strandbad-untersee.html"},"booking":{"status":"无需预约","detail":"公共湖岸短走无需预约；不含私人草地、船屋或包船。秋季不默认泳场服务仍开放。","url":"https://dachstein.salzkammergut.at/oesterreich-poi/detail/200188/strandbad-untersee.html"}},{"id":"lk-ischl","city":"湖区","name":"Bad Ischl · 咖啡、河岸与小镇","kind":"街区","weather":"雨天可用","time":"半天","budget":"逛街免费，餐饮另计","why":"适合云多或体力一般的那天，有地方坐、有餐饮，不必全程在山里淋雨。","do":"Pfarrgasse → Zauner → Esplanade；雨停再加公园，小雨就以店铺和咖啡为主。","access":"Bad Goisern 火车往 Bad Ischl；班次和门到门时间通过 ÖBB 查，不把列车用时当整段耗时。","hours":"咖啡两店营业时间见独立卡片；部分小店午间可能休息。","caution":"也是知名度假小镇，不假装绝对小众。当天不必再追另一个湖。","refs":["zauner","oebb","visual-lk-ischl-0"],"map":"Esplanade Bad Ischl","effort":"轻松","intro":"湖区里一座有咖啡馆、商店和河岸步道的小镇。这半天以镇中心慢逛与甜点休息为主。","appearance":"街道两侧是浅色立面与店铺，镇中心有教堂尖塔；走到 Esplanade 则变成沿 Traun 河的散步景观。","highlights":["从 Pfarrgasse 逛到河岸，看店铺、街景和河水。","中途进 Zauner 吃甜点，天气反复时也有地方坐。"],"bestTime":"建议晚上午到下午，把散步和咖啡安排在一起；小雨适合缩短户外段，别等商店关门后才来。","tradeoff":"是有人气的度假小镇，不能保证清静；自然景观的冲击感不如 Gosausee 或高山。","photo":{"url":"https://badischl.salzkammergut.at/fileadmin/_processed_/3/3/csm_EinkaufsstrasseBadIschl_OberoesterreichTourismusBadIschlRobertJosipovic_121412445e.jpg","page":"https://badischl.salzkammergut.at/en/","caption":"Bad Ischl 镇中心购物街","credit":"Oberösterreich Tourismus / Bad Ischl / Robert Josipovic"},"booking":{"status":"无需预约","detail":"逛公共街道和河岸无需预约；餐厅或收费场馆分别确认。","url":"https://badischl.salzkammergut.at/en/"},"coordinateNote":"图钉为 Esplanade 河岸步道的一处代表位置，不是整个 Bad Ischl 的唯一入口。","coordinates":{"lat":47.7099762,"lng":13.6198181,"sourceUrl":"https://www.openstreetmap.org/way/4613187","label":"Esplanade, Steinbruch, Kaltenbach, Bad Ischl, Bezirk Gmunden, Oberösterreich, 4820, Österreich"}},{"id":"lk-steeg","city":"湖区","name":"Steegwirt · 留一顿湖区认真吃的饭","kind":"吃喝","weather":"雨天可用","time":"1.5–2 小时","budget":"每人约 €45–80（预算，不含高价酒）","why":"比三天都随便凑合，更值得把一个晚上留给当地餐厅。","do":"按当天菜单考虑湖鱼或区域菜；有饮食禁忌在预订时说明。","access":"Au 12，Bad Goisern；从 Jeff’s 不是楼下就到，去回都安排交通。","hours":"周三至周日 10:00–22:00，热食 11:30–20:30；周一、周二休息。","caution":"建议 9/30 或 10/1 18:00。只先锁定一个日期，另一日留给天气，不同时占两个订位。","refs":["steegwirt","visual-lk-steeg-0"],"map":"Steegwirt Au 12 Bad Goisern","effort":"轻松","intro":"一间有约 450 年历史的奥地利老客栈餐馆，曾接待运盐的船工；现在适合认真吃一顿区域料理。","appearance":"室内能看到厚重老木梁、木桌椅和传统装饰，是坐下用餐的老屋气氛。","highlights":["试试官网介绍的传统烤猪肉配卷心菜、面包团子，或按当天菜单选区域菜。","把湖区的一顿晚餐留给老屋空间与当地饮食，不用边赶路边吃。"],"bestTime":"建议按原计划确认一晚 18:00 左右桌位，留出 1.5–2 小时；雨天同样适合，往返交通要先安排。","tradeoff":"花费与用餐时间都高于简单晚饭；不在住宿楼下，不能把湖边散步结束的位置当作餐厅门口。","photo":{"url":"https://www.steegwirt.at/uploads/pZZTGWds/644x0_644x0/bild3__msi___jpg.webp","page":"https://www.steegwirt.at/","caption":"Steegwirt 室内：老木梁与餐桌","credit":"Steegwirt 官网；摄影署名未列出"},"coordinates":{"lat":47.612125,"lng":13.632213,"sourceUrl":"https://www.steegwirt.at/"},"booking":{"status":"建议预约","detail":"建议先确认两人桌位，收到回复才算订位。未替你们预约；午餐与晚餐按兴趣选一次。","url":"https://www.steegwirt.at/speis--trank/tischanfrage"}},{"id":"lk-moser","city":"湖区","name":"Moserwirt · 抵达当晚的稳妥晚餐","kind":"吃喝","weather":"雨天可用","time":"1–1.5 小时","budget":"每人约 €25–45（预算）","why":"9/29 晚入住后就在镇里吃，不再赶另一个镇。","do":"订 18:30 左右，并说明列车 17:24 抵达；晚点时及时通知。","access":"Kirchengasse 6，镇中心。是否步行回 Jeff’s，按天黑与疲劳决定。","hours":"周二官网晚餐 17:30–21:00；周三休息，周四特殊餐需预订。","caution":"别拿它当每天都开的兜底店，尤其 9/30 周三。","refs":["moser"],"map":"Moserwirt Bad Goisern","effort":"轻松","intro":"Bad Goisern 镇中心的传统客栈餐馆，适合抵达后吃一顿热饭，不再为了晚餐赶去另一个镇。","appearance":"明亮的用餐室配木桌椅和绿色瓷砖炉，保留老客栈的元素，又不是昏暗的山间小屋。","highlights":["入住后坐下来吃晚饭，把当天最后一段安排放轻松。","晴暖时可问花园位，天气不好就在传统用餐室休息。"],"bestTime":"建议沿用抵达日约 18:30 的安排，列车晚点就联系店家；周三闭店，不能当作每天的备用晚餐。","tradeoff":"优势在镇内方便与稳定用餐，目的不是湖景；周四的特定晚餐需预约，选择不如普通营业日自由。","photo":{"url":"https://www.moserwirt.at/wp-content/uploads/Moserwirt-07-2020-RK-Gaststube-B07-1920x1280WEB.jpg","page":"https://www.moserwirt.at/gasthof/","caption":"Moserwirt 用餐空间","credit":"Moserwirt 官网；摄影署名未列出"},"coordinates":{"lat":47.642577,"lng":13.617033,"sourceUrl":"https://dachstein.salzkammergut.at/oesterreich-gastronomie/detail/101255/gasthof-hotel-moserwirt.html"},"booking":{"status":"建议预约","detail":"正式晚餐建议联系店家确认桌位；周四特定晚餐尤其先问，不默认可以直接到店。","url":"https://www.moserwirt.at/kontakt/"}},{"id":"lk-zauner","city":"湖区","name":"Zauner · 河岸甜点或老店咖啡","kind":"吃喝","weather":"雨天可用","tim "refs":["grebovka"],"map":"Havlíčkovy sady Prague","effort":"轻松","intro":"建在山坡上的城市公园，把意大利风格园景、人工岩洞和葡萄园放在同一片步道里。","appearance":"可见拱洞与喷泉、别墅、台阶，以及顺坡排列的葡萄藤。","highlights":["看看岩洞与喷泉，再沿园路散步","走到葡萄园视野开阔处，再去木亭休息"],"bestTime":"建议晴天或阴天的午后，接市集和午饭；留在白天更容易看清园景。","tradeoff":"有坡与台阶，景物分散；腿累就只选一小段，雨天别为凑全园反复上下。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13095552/160504-pct-big-00002-grota-sady-m.jpg","page":"https://prague.eu/en/objevujte/havlicek-gardens-grebovka-havlickovy-sady/","caption":"Grébovka 公园的人工岩洞与喷泉","credit":"Prague City Tourism"},"coordinates":{"lat":50.069081150685,"lng":14.445300580908,"sourceUrl":"https://prague.eu/en/objevujte/havlicek-gardens-grebovka-havlickovy-sady/"},"booking":{"status":"无需预约","detail":"公共公园散步不用订票，园内餐饮另算。","url":"https://prague.eu/en/objevujte/havlicek-gardens-grebovka-havlickovy-sady/"}},{"id":"pr-altan","city":"布拉格","name":"Altán Grébovka · 葡萄园旁坐下来","kind":"吃喝","weather":"晴阴","time":"45–90 分钟","budget":"每人约 250–500 CZK（预算）","why":"在风景里休息，而不是又找一个拍照点。","do":"一杯饮品加少量吃的即可；不作为唯一正式午餐来源。","access":"Havlíčkovy sady 内；与 Grébovka 公园同一区域。","hours":"旅游局列周末 11:00–22:00，工作日 12:00–22:00。","caution":"露台位看天气与到店情况；阴雨可舍弃。","refs":["altan"],"map":"Altán Grébovka Prague","effort":"轻松","intro":"Grébovka 葡萄园里的木制凉亭餐吧，是公园中坐下喝饮品、看葡萄藤的停留点。","appearance":"开放式木亭架在葡萄园坡上，木栏杆外就是一行行藤架。","highlights":["在葡萄园旁坐下喝一杯","把公园散步分成两段，边休息边看风景"],"bestTime":"建议有日光的午后，和 Grébovka 公园一起去；好天气比专门卡时间更重要。","tradeoff":"景观席位受天气和到店情况影响；阴雨可跳过，不作为唯一正餐来源。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13084752/jpgtif-dsc6621-1.jpg","page":"https://prague.eu/en/objevujte/altan-grebovka/","caption":"Altán Grébovka 木亭与葡萄园","credit":"Prague City Tourism"},"coordinates":{"lat":50.068729442503,"lng":14.444285283328,"sourceUrl":"https://prague.eu/en/objevujte/altan-grebovka/"},"booking":{"status":"建议预约","detail":"有确定用餐时段或想坐景观位时，建议提前联系；不保证能指定露台席位。","url":"https://prague.eu/en/objevujte/altan-grebovka/"}},{"id":"pr-brevnov","city":"布拉格","name":"Břevnov 修道院花园","kind":"风景","weather":"晴阴","time":"1–2 小时","budget":"花园散步免费，内部导览另计","why":"从城堡区往西，少进核心游客区，适合你们周日飞行前的半日。","do":"只逛花园与外部，再去 Klášterní šenk 午餐。","access":"从 Lindner 到 Břevnov 用公交/出租车，建议单程预留 20–35 分钟。","hours":"官方列下层花园 06:45–20:00；内部导览有固定班次，主要捷克语。","caution":"庭院开放不代表可自由走进全部宗教空间。不要为导览牺牲午后回酒店取行李时间。","refs":["brevnov"],"map":"Břevnov Monastery Prague","effort":"轻松","intro":"始建于 993 年的本笃会修道院，今天看到的是巴洛克建筑群与向公众开放的花园。","appearance":"浅色教堂、绿色塔顶、修道院建筑和池塘，水边能看建筑倒影。","highlights":["只走花园与院落，看教堂外观和池塘","顺路去 Klášterní šenk 吃捷克午餐"],"bestTime":"建议周日上午，午饭后还能从容回酒店取行李；内部导览不用硬塞进当天。","tradeoff":"花园散步和内部参观是两回事；内部有固定导览，普通庭院开放不代表所有空间可进。","photo":{"url":"https://cdn.praguecitytourism.city/2024/04/21132619/jpgtif_DSC4663.jpg","page":"https://prague.eu/en/objevujte/brevnov-monastery-brevnovsky-klaster/","caption":"Břevnov 修道院与池塘倒影","credit":"Prague City Tourism"},"coordinates":{"lat":50.084750418499,"lng":14.356808668123,"sourceUrl":"https://prague.eu/en/objevujte/brevnov-monastery-brevnovsky-klaster/"},"booking":{"status":"花园无需预约","detail":"这里的候选是花园和外观；内部导览另有固定班次，英文导览需事先安排。","url":"https://prague.eu/en/objevujte/brevnov-monastery-brevnovsky-klaster/"}},{"id":"pr-senk","city":"布拉格","name":"Klášterní šenk · 修道院里的捷克午餐","kind":"吃喝","weather":"雨天可用","time":"1–1.5 小时","budget":"每人约 450–800 CZK（预算）","why":"与 Břevnov 花园自然拼成半日，没有为了饭店的跨城绕路。","do":"选传统捷克菜和汤，午饭后还可散步；避开临走前临时抢桌。","access":"Markétská 1/28，Břevnov 修道院内。","hours":"每日 11:30–23:00；电话 +420 220 406294。","caution":"线上表单只是申请，收到餐厅确认才算有位。建议 10/4 12:30。","refs":["senk"],"map":"Klášterní šenk Břevnov Prague","effort":"轻松","intro":"Břevnov 修道院内的传统捷克餐厅，适合把花园散步和一顿热午餐接在一起。","appearance":"老建筑里的木梁、木桌椅和吧台，整体是传统酒馆氛围。","highlights":["选汤和捷克主菜坐下来吃","吃完可继续院落短走，不用为餐厅额外跨城"],"bestTime":"建议周日约 12:30，接修道院上午散步；先收到餐厅确认，再按订位安排。","tradeoff":"在线表单只是申请，未确认不算有桌；别套用工作日午间特价到周日。","photo":{"url":"https://www.klasternisenk.cz/obr/galerie/obr/02.jpg","page":"https://www.klasternisenk.cz/de/galerie","caption":"Klášterní šenk 餐厅内部","credit":"Klášterní šenk"},"coordinates":{"lat":50.083808577516,"lng":14.3567160021,"sourceUrl":"https://prague.eu/cs/objevujte/klasterni-senk/"},"booking":{"status":"建议预约","detail":"官网要求收到餐厅电话或邮件确认才算订位成功；当天订位请致电，网上表单用于提前至少 24 小时申请。","url":"https://www.klasternisenk.cz/"}},{"id":"pr-hvezda","city":"布拉格","name":"Hvězda · 真正留给散步的森林公园","kind":"风景","weather":"晴阴","time":"1.5–2 小时","budget":"公园免费","why":"不需要知名地标就能成立的活动，适合只想走走、坐坐的人。","do":"选林荫大道短线往返；宫殿只看外部，不强行加内部参观。","access":"在 Břevnov 以西，作为同方向延伸；公共交通回酒店先查好。","hours":"旅游局说明公园全年对公众开放。","caution":"雨后林地可能泥泞。10/4 若下午超过 15:00 才想去，就直接跳过。","refs":["hvezda"],"map":"Obora Hvězda Prague","effort":"轻松","intro":"曾作王室狩猎场的大片林地公园，几条笔直林荫道通向六角星形平面的夏宫。","appearance":"高树围着宽阔步道，尽头是一座浅色、造型简洁的夏宫。","highlights":["沿一条林荫大道走到夏宫外，再原路返回","在树荫下走走坐坐，不需要进馆"],"bestTime":"建议晴天的上午或早下午；你们飞行当天若已经超过 15:00，就按原计划跳过。","tradeoff":"亮点是树林和散步，不是密集景点；在 Břevnov 更西边，会增加往返时间，雨后可能泥泞。","photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13095307/obora-hvezda.jpg","page":"https://prague.eu/cs/objevujte/obora-hvezda/","caption":"Hvězda 林荫大道与夏宫外观","credit":"Prague City Tourism"},"coordinates":{"lat":50.083287985517,"lng":14.327372564038,"sourceUrl":"https://prague.eu/cs/objevujte/obora-hvezda/"},"booking":{"status":"公园无需预约","detail":"森林公园全年自由进入；夏宫内部参观不包含在这项散步候选里。","url":"https://prague.eu/cs/objevujte/obora-hvezda/"}},{"id":"pr-library","city":"布拉格","name":"Strahov Library · 就近雨天备选","kind":"室内","weather":"雨天可用","time":"约 1 小时","budget":"票种和价格按官网","why":"住在旁边的优势是无需为了躲雨移动很远，但先对参观内容有合理预期。","do":"上午看图书馆与相关展陈；购票前核对普通票可进入的区域，不假设可在书厅书架间自由走。","access":"Lindner 周边步行。","hours":"馆内通常 09:00–17:00；图书馆单项售票至 16:15、最晚进入 16:30。","caution":"10/2 抵达后不赶最后入场。想深入看书厅，先向官方确认特殊参观权限。","refs":["strahov","libraryexperience","visual-pr-library-0"],"map":"Strahov Library Prague","effort":"轻松","intro":"Strahov 修道院保存至今的历史图书馆；这一站主要看书厅建筑与天花装饰。","appearance":"高耸木书架、满墙古书、地球仪和绘满壁画的天花，是很直观的室内建筑看点。","highlights":["从门口观看神学厅与哲学厅的书架、壁画","沿走廊看珍奇柜和书籍相关展陈"],"bestTime":"建议雨天上午，作为酒店附近约一小时的替代；10/2 抵达后不赶末场。","tradeoff":"普通票不能走进两座历史书厅，只能从入口观看；照片展示书厅全貌，不代表购票后可站到照片位置。","photo":{"url":"https://c 2.jpg","page":"https://prague.eu/en/objevujte/vysehrad-gardens-vysehradske-sady/","caption":"Vyšehrad 城墙、绿地与教堂双尖塔","credit":"Prague City Tourism"}},{"id":"pr-oldtown","name":"老城广场 · 一眼看懂布拉格老城","kind":"街区","weather":"晴阴","time":"45–90 分钟","budget":"广场外观散步免费；登塔、室内参观和餐饮另计","intro":"布拉格历史中心的大广场，老市政厅、泰恩教堂与多种时代的建筑立面集中在周围。","appearance":"开阔石铺广场被彩色老楼围住，泰恩教堂双尖塔和胡斯纪念碑很容易认。","highlights":["绕广场看不同建筑立面和教堂双塔","看老市政厅与天文钟外观，不登塔也能认识地点"],"why":"适合第一次来、想知道布拉格经典城市画面从何而来的人，一小段停留就有鲜明印象。","do":"从广场一侧慢慢走到另一侧，挑喜欢的立面看；若人多就从旁边街巷离开，不必等每一个表演或拍照点。","access":"从 Lindner 所在城堡区到老城，可乘公共交通后步行；与查理大桥同属经典中心区域，地图上可比较是否顺路。","hours":"公共广场外观不需要场次；市政厅、塔楼、教堂内部各自售票或开放，请单独核对。","caution":"游客核心区，拥挤与商业气氛是需要接受的取舍；不把广场上的餐厅默认当性价比最优选。","map":"Old Town Square Prague","effort":"主要为石板平路","bestTime":"建议上午较早或下午后段看立面；如果已经走查理大桥，可按体力选是否一起看，不强行等整点。","tradeoff":"典型、集中，但安静程度不如 Nový Svět；与查理大桥都是热门老城体验，不用为了打卡同时选满。","city":"布拉格","refs":["city-pr-oldtown-0"],"coordinates":{"lat":50.087524890749,"lng":14.421104907924,"sourceUrl":"https://prague.eu/en/objevujte/old-town-square-staromestske-namesti/"},"booking":{"status":"无需预约","detail":"这里推荐公共街巷或园区外观散步，不需预约；付费室内、登塔或导览另查。","url":"https://prague.eu/en/objevujte/old-town-square-staromestske-namesti/"},"photo":{"url":"https://cdn.praguecitytourism.city/2024/03/13101933/01-stm-radnice-0288ret-m.jpg","page":"https://prague.eu/en/objevujte/old-town-square-staromestske-namesti/","caption":"老城广场与泰恩教堂双塔，旅游局高处视角","credit":"Prague City Tourism"}},{"id":"lk-hallstatt","city":"湖区","name":"Hallstatt · 经典湖畔村落","kind":"风景","weather":"晴阴","time":"村内约 2–3 小时，交通另计","budget":"公共街道散步不需村落门票；交通、餐饮和其他场馆另计","why":"想亲眼看湖边密集老屋与经典村落街景时，它与只看山水的 Untersee 是不同体验。","do":"沿公共湖岸街道慢走，到市场广场看彩色房屋，挑一处坐下来；不默认加盐矿或缆车。","access":"火车的 Hallstatt Bahnhof 在对岸，需再乘船到村内；公交到 Hallstatt Lahn。汽车游客不能直接开进历史中心。","hours":"公共街道按现场通行情况；店铺、教堂及其他场馆分别确认。","caution":"游客集中、空间窄，居民门口和私人台阶不要进入或堵路；停车位不能提前保证，别把停车耗时漏掉。","refs":["city-lk-hallstatt-0","city-lk-hallstatt-1","city-lk-hallstatt-2"],"map":"Hallstatt Marktplatz Austria","effort":"轻至中等","intro":"夹 tes":{"lat":47.64087293230039,"lng":13.765997886657706,"sourceUrl":"https://www.salzkammergut.at/en/oesterreich-stadt-ort/detail/430001787/altaussee.html"},"coordinateNote":"官方页面地点锚点；代表广场或村镇入口，不是精确的湖岸拍照机位。","photo":{"url":"https://assets.tourdata.at/660x495/244660/739C2811C2E4017344A74B8C21A862ED2F9D906B548CC5063A98577CD3D09541/altausseer-see.jpg","page":"https://www.salzkammergut.at/en/oesterreich-stadt-ort/detail/430001787/altaussee.html","caption":"Altaussee 湖岸与山景","credit":"Tourismusverband Ausseerland - Salzkammergut"}},{"id":"lk-stgilgen","city":"湖区","name":"St. Gilgen · Wolfgangsee 湖畔村镇","kind":"街区","weather":"晴阴","time":"镇内和湖岸约 2–3 小时，交通另计","budget":"公共街道与湖岸散步为主，交通餐饮另计","why":"相比“船上看湖”，这项更适合想下船走走、看房屋与广场、坐湖边咖啡馆的人。","do":"镇中心短走，再到公共湖岸看 Wolfgangsee；坐一会儿即可，不默认加缆车。","access":"通常先接到 Bad Ischl 方向再转往 St. Gilgen 的交通；也可由已选的 Wolfgangsee 船线衔接，但必须核对停靠与回程。","hours":"公共街道白天游览；具体商店、餐厅和船班另查。","caution":"与 Wolfgangsee 游船属于同一片湖景，收藏两项不等于需要安排两次往返；照片是高处全景，非湖岸步行视角。","refs":["city-lk-stgilgen-0","visual-lk-wolfgang-0"],"map":"St Gilgen Wolfgangsee Austria","effort":"中等（主要是往返交通）","intro":"Wolfgangsee 北岸的村镇，既有临湖散步空间，也有传统房屋与小街；它是岸上逛镇体验，不是另一座湖。","appearance":"教堂尖塔、浅色房屋和红褐屋顶集中在湖边，后面是绿色山坡；湖面向远处山谷展开。","highlights":["逛村镇街道和公共湖岸，把房屋、小广场与湖景放在一起看。","可作为 Wolfgangsee 游船的一处岸上停留；不坐船也能只逛镇。"],"bestTime":"建议白天店铺与餐饮可用时慢逛；若搭船到达，先用班表确定回程，别为了傍晚湖景错过连接。","tradeoff":"从 Bad Goisern 过去比附近湖岸远；景观与 Wolfgangsee 船程有重叠，选它应是为了岸上生活感而非凑第三个湖。","booking":{"status":"逛镇无需预约","detail":"公共街道与湖岸不需预约；搭船需船票、缆车需另购票，本卡不默认包含这些项目。","url":"https://www.salzkammergut.at/en/oesterreich-stadt-ort/detail/430001365/st-gilgen.html"},"coordinates":{"lat":47.76908473671826,"lng":13.359342813491821,"sourceUrl":"https://www.salzkammergut.at/en/oesterreich-stadt-ort/detail/430001365/st-gilgen.html"},"coordinateNote":"官方页面地点锚点；代表广场或村镇入口，不是精确的湖岸拍照机位。","photo":{"url":"https://assets.tourdata.at/260x195/397517/616387667C1060A4988E66DC79134971709FEAB4358FCC939897925D41807D4E/blickueberstgilgenunddenwolfgangseewolfgangseetourismusmirjageh-jpg.jpg","page":"https://www.salzkammergut.at/en/oesterreich-stadt-ort/detail/430001365/st-gilgen.html","caption":"St. Gilgen 镇中心与 Wolfgangsee 的高处全景（来源缩略图）","credit":"Mirja Geh / Wolfgangsee Tourismus"}},{"id":"bp-castle","city":"布达佩斯","name":"Fisherman’s Bastion · 渔人堡与城堡区","kind":"风景","weather":"晴阴","time":"1.5–3 小时","budget":"街区及下层露台免费；上层露台、教堂内部另付费","intro":"布达山上的观景露台和历史街区。渔人堡看着像童话城堡，主要用途是看多瑙河与佩斯全景。","appearance":"浅色石塔、拱廊和台阶，旁边是马加什教堂彩色屋顶；远处能看到河对岸的国会大厦。","highlights":["从下层露台看多瑙河、国会大厦与桥","在城堡区石板小街慢走，看马加什教堂外观"],"why":"比普通街区更有明确的大景，适合第一次到布达佩斯、想看到代表性城市轮廓的人。","do":"先在渔人堡看全景，再选几条附近小街；不自动加教堂内部或博物馆。","access":"位于布达山上，需跨河并上坡；可结合公交减少爬坡，具体乘车查 BudapestGO。","hours":"户外街区可散步；上层收费露台及教堂的营业以官网当天为准。","caution":"有台阶、坡度和游客；露台景观不等于已包含马加什教堂内部。","map":"Fisherman's Bastion Budapest","effort":"有上坡","bestTime":"建议白天能见度好时看河岸全景；傍晚可看城市亮灯，但别为夜景压缩休息。","tradeoff":"景观辨识度强，但比酒店附近散步费体力，热门机位可能拥挤。","booking":{"status":"户外无需预约","detail":"街区与下层露台不用预约；上层露台或教堂内部须按当天规则购票，非本条默认内容。","url":"https://www.budapestinfo.hu/en/10-best-viewpoints-in-budapest"},"refs":["city-bp-castle-0","city-bp-castle-1"],"coordinates":{"lat":47.5023053,"lng":19.0346998,"sourceUrl":"https://www.openstreetmap.org/relation/17948384","label":"Halászbástya, Gimnázium utca, Buda, Víziváros, I. kerület, Budapest, Közép-Magyarország, 1015, Magyarország"},"photo":{"url":"https://budapestinfo.hu/storage/content-pages/1e9ZlOAZkMEsC3dQ9SKOpZNvKnItXE2MhG0K19Ua.jpg","page":"https://www.budapestinfo.hu/en/10-best-viewpoints-in-budapest","caption":"渔人堡的石拱廊与塔楼，黎明时拍摄","credit":"Krisztián Bódis / Budapestinfo"}},{"id":"bp-danube","city":"布达佩斯","name":"Danube Promenade · 河岸散步与 2 路电车","kind":"风景","weather":"晴阴","time":"1–2 小时","budget":"河岸散步免费；电车另需有效交通票","intro":"沿佩斯一侧的多瑙河岸看布达山与桥梁，也可坐一小段沿河的 2 路电车，让景色从窗边经过。","appearance":"河岸栏杆、桥梁、黄色电车与对岸高起的城堡轮廓，城市全景比小街更开阔。","highlights":["在 Vigadó tér 一带沿河走走，找对岸城堡角度","累了改坐一小段 2 路电车看河岸，站点按当天运行查询"],"why":"不用把时间都花在走路上，也能很直接地理解布达佩斯为什么围着这条河展开。","do":"选一段河岸散步，或选择电车靠河侧看看窗外；不用坐完全程。","access":"可从酒店所在佩斯市中心走向 Vigadó tér；上下站与临时改道查 BudapestGO。","hours":"河岸为开放空间；电车按当天班次运行，不套用历史怀旧电车活动时刻。","caution":"2 路是日常交通，不是包车观光；不保证有座，街道与轨道过路需走指定通道。","map":"Vigadó tér Budapest","effort":"轻松","bestTime":"白天看建筑细节，傍晚看河岸和城市亮灯；风大或下雨时缩短步行。","tradeoff":"距离酒店近、随时可缩短，但河边风大，车窗反光和乘客可能影响拍照。","booking":{"status":"无需预约，乘车需票","detail":"散步无需预约；电车使用有效 BKK 车票或通票，登车验票规则以官方说明为准。","url":"https://bkk.hu/en/"},"refs":["city-bp-danube-0","city-bp-danube-1","city-bp-castle-1"],"coordinates":{"lat":47.4957076,"lng":19.0488096,"sourceUrl":"https://www.openstreetmap.org/way/24051160","label":"Vigadó tér, Lipótváros, V. kerület, Budapest, Közép-Magyarország, Magyarország"},"photo":{"url":"https://budapestinfo.hu/storage/media-library/7633/i-(5).jpg","page":"https://www.budapestinfo.hu/en/best-photo-spots-in-budapest","caption":"佩斯多瑙河岸步道、黄色电车与河对岸山景","credit":"Budapestinfo；页面未标独立摄影者"}},{"id":"bp-margaret","city":"布达佩斯","name":"Margaret Island · 玛格丽特岛公园","kind":"放空","weather":"晴阴","time":"1.5–3 小时","budget":"公共公园散步免费；园内特定设施另算","intro":"多瑙河中间的一座城市公园岛，主要体验是树荫、草地、河边步道与慢走。","appearance":"大片绿地与林荫道、喷泉和历史遗迹散落其中，河水在岛的两侧。","highlights":["选岛南部或中部的一小段树荫路走走","在草地或河边坐下，看船和城市远景"],"why":"适合想从街区和店铺里换到绿地、给两人留出闲聊时间的半天。","do":"只挑一小段公园散步，不把走完整座岛作为目标；喷泉以当天实际运行作附加惊喜。","access":"可从 Margit híd 的岛上入口进入；岛内长度不短，返程别只按入口距离估计。","hours":"公共空间可散步；音乐喷泉与园内设施有季节、天气及各自时段限制。","caution":"不要把看到宣传图的喷泉表演当成已核实本次日程；有些设施另需购票。","map":"Margaret Island Budapest","effort":"轻松","bestTime":"建议天气舒适的白天，选树荫或河岸短走；不专门卡未经核实的喷泉时间。","tradeoff":"休息感强但不是紧凑地标路线；天冷下雨时吸引力下降，走深了仍要原路回或找车。","booking":{"status":"散步无需预约","detail":"公共绿地不用预约；演出、水塔等独立设施另查门票与营业。","url":"https://www.budapestinfo.hu/en/margaret-island"},"refs":["city-bp-margaret-0"],"coordinates":{"lat":47.5266408,"lng":19.0463939,"sourceUrl":"https://budapestinfo.hu/en/margaret-island","note":"旅游局整座岛示意点，不是南端喷泉定位"},"photo":{"url":"https://budapestinfo.hu/storage/content-pages/iRSBbtDfIhhnlGsTzoIlSYLq0RGrcCnezjYVneJ7.jpg","page":"https://www.budapestinfo.hu/en/margaret-island","caption":"玛格丽特岛音乐喷泉与树荫；是否喷水以当天为准","credit":"Soós Bertalan / Budapestinfo"},"co 费主公园理解成所有园区、Gloriette 屋顶和宫殿都免费。","map":"Schönbrunn Palace Gardens Vienna","effort":"有上坡","bestTime":"建议天亮且天气稳定时，留出慢走时间；傍晚前回到出口，不为日落忽略关园时间。","tradeoff":"大景清楚、无需看展，但比酒店附近的 Belvedere 远且更耗步数；疲劳日只走平坦主花坛。","booking":{"status":"主花园无需预约","detail":"免费主公园按开放时间进入；迷宫、特别花园与 Gloriette 观景台等另购票。","url":"https://www.schoenbrunn.at/en/about-schoenbrunn/gardens"},"refs":["city-vi-schonbrunn-0"],"coordinates":{"lat":48.1849894,"lng":16.3115684,"sourceUrl":"https://www.openstreetmap.org/way/8756754","label":"Schloss Schönbrunn, 47, Schönbrunner Schloßstraße, Katastralgemeinde Schönbrunn, Hietzing, Wien, 1130, Österreich"},"photo":{"url":"https://www.schoenbrunn.at/fileadmin/_processed_/1/2/csm_csm_Grosses_Parterre__1__c_Koller_4e6d763759_90ab1821d7.jpg","page":"https://www.schoenbrunn.at/en/about-schoenbrunn/gardens","caption":"美泉宫大花坛与远处 Gloriette，高处俯视角度","credit":"Schloß Schönbrunn Kultur- und Betriebsges.m.b.H. / Alexander Eugen Koller"}},{"id":"vi-naschmarkt","city":"维也纳","name":"Naschmarkt · 食材市集与午餐","kind":"吃喝","weather":"晴阴","time":"1–2 小时","budget":"逛市场免费；买食物和用餐另计","intro":"由食材摊、熟食与餐厅组成的长条城市市场，适合看看食物、买少量零食、找一顿午饭。","appearance":"一排排摊棚、蔬果香料与餐厅露天座位，颜色和人流都比普通购物街丰富。","highlights":["沿摊位比较蔬果、香料、奶酪和熟食","按胃口选一家餐厅坐下，不需要把每种东西都尝遍"],"why":"比只看店铺更有具体事情可做，也容易与附近 Freihausviertel 组合成一段城市散步。","do":"先走一遍看摊位再买，问清标价与计价单位；吃饱就不继续追餐。","access":"在 Karlsplatz 与 Kettenbrückengasse 之间，可与 Schleifmühlgasse 街区衔接。","hours":"市场主要周一至周六营业，周日通常只有部分餐厅；周六跳蚤市场是另一个内容。","caution":"你们维也纳停留若选周一可逛市场，但不能当成周六跳蚤市场；摊位可能早于最晚许可时刻收摊。","map":"Naschmarkt Vienna","effort":"轻松","bestTime":"想看市场选工作日白天，晚间更偏餐厅；周日不要按完整市场体验期待。","tradeoff":"热闹好吃但游客也多，餐饮不只奥地利菜；不适合寻找清静或把所有摊位都当本地农家直销。","booking":{"status":"逛市场无需预约","detail":"摊位随到随逛；若锁定某一家餐厅和固定时间，可另订桌。","url":"https://www.wien.info/en/dine-drink/markets/naschmarkt-353536"},"refs":["city-vi-naschmarkt-0"],"coordinates":{"lat":48.19786262729421,"lng":16.36220283074954,"sourceUrl":"https://www.wien.info/en/dine-drink/markets/naschmarkt-353536"},"photo":{"url":"https://www.wien.info/resource/image/305544/19x10/1200/630/e38767db7b6609cfc6339468d4e5b399/20E05319D4D670E585B6FDA24416ED8E/51483-naschmarkt-wiener-maerkte.jpg","page":"https://www.wien.info/en/dine-drink/markets/naschmarkt-353536","caption":"Naschmarkt 蔬果摊位","credit":"WienTourismus / Julius Hirtzberger"}},{"id":"vi-prater","city":"维也纳","name":"Prater · 游乐园散步与老摩天轮","kind":"体验","weather":"晴阴","time":"1.5–3 小时","budget":"园区可免费进入；摩天轮和游乐设施单独付费","intro":"维也纳的开放式游乐区，旁边连接大片绿地；可以只看灯光和散步，想登高再坐历史摩天轮。","appearance":"大摩天轮、旋转设施、彩色灯牌和小吃摊，走远一点会转成树木与草地。","highlights":["逛游乐区，看摩天轮与灯光，不玩项目也可以","可选乘坐 Wiener Riesenrad 从高处看城市"],"why":"提供与咖啡馆、宫殿花园不同的轻松玩乐感，适合想要一点约会式体验的人。","do":"先逛一小段，只有双方都想坐时再买摩天轮票；绿地短走与游乐设施按兴趣二选一。","access":"从 Praterstern 公共交通站进入游乐区较方便；地图点标示游乐区，不是整片绿地中心。","hours":"开放区域与各游乐设施时段不同；摩天轮和项目按运营方当天信息。","caution":"无需购买统一园区门票，不代表每个游乐项目都免费；天气差时部分设施可能不运行。","map":"Wiener Prater Vienna","effort":"轻松","bestTime":"下午接傍晚适合从白天园景看到灯光；想坐摩天轮先确认当天营业，别临关门才到。","tradeoff":"气氛鲜明但热闹，有音乐与机械声；若只想安静自然，就改选旁边 Green Prater 短走。","booking":{"status":"入园无需预约，项目另购票","detail":"散步可直接入园；摩天轮需单独买票，可在官方渠道预购，其他项目各自经营。","url":"https://www.wienerriesenrad.com/"},"refs":["city-vi-prater-0","city-vi-prater-1"],"coordinates":{"lat":48.21626278936696,"lng":16.396246526953064,"sourceUrl":"https://www.wien.info/en/see-do/prater/experience-prater-345598"},"photo":{"url":"https://www.wien.info/resource/image/290054/19x10/1200/630/50f322f051bbd51b47b0e882fa5ec2f6/FFEC1230E03F165D0BD28434071855CD/26041-wiener-prater-mit-riesenrad.jpg","page":"https://www.wien.info/en/see-do/prater/experience-prater-345598","caption":"Prater 历史摩天轮与游乐区，夕照高处视角","credit":"WienTourismus / Peter Rigaud"}},{"id":"vi-danube","city":"维也纳","name":"Danube Canal · 运河步道与街头气氛","kind":"街区","weather":"晴阴","time":"1–1.5 小时","budget":"散步免费；河边餐饮另计","intro":"靠近老城的多瑙运河滨水步道，主要看水边日常生活、街头涂鸦和季节性餐饮，不是多瑙河主河道。","appearance":"低处步道沿水延伸，桥梁、涂鸦墙与露天座位相间，整体更现代随意。","highlights":["从 Schwedenplatz 一带下到运河边，选一小段慢走","天气合适时找开放的河边座位喝一杯，看行人和骑车的人"],"why":"适合在老城附近换个气氛，活动很自由，走十几分钟或坐一小时都成立。","do":"只挑离你们当时位置近的一段，步行与骑车道注意让行；不追求走完运河。","access":"可从 Schwedenplatz / Schwedenbrücke 附近开始；上下河岸需要找台阶或坡道。","hours":"公共滨水步道可散步；露天酒吧和餐饮随季节、天气与店家营业，不保证秋夜都开。","caution":"河岸并非所有路段都同样热闹或有座位；不要把它与 Donauinsel 或多瑙河主流混为一处。","map":"Schwedenbrücke Vienna","effort":"轻松","bestTime":"建议下午到傍晚，既能看街头细节也有水边气氛；阴冷大风时不必特意来。","tradeoff":"免费随意，但景色偏日常，缺少宫殿式大景；部分路段骑车人多，入夜体验取决于店铺与天气。","booking":{"status":"散步无需预约","detail":"公共步道不用预约；如指定河边餐厅，餐桌需另确认。","url":"https://www.wien.gv.at/umwelt/donaukanal"},"refs":["city-vi-danube-0","city-vi-danube-1"],"coordinates":{"lat":48.2121101,"lng":16.3790257,"sourceUrl":"https://www.openstreetmap.org/way/230483960","label":"Schwedenbrücke, Leopoldstadt, Katastralgemeinde Leopoldstadt, Leopoldstadt, Wien, 1020, Österreich"},"photo":{"url":"https://www.wien.gv.at/bilder/_imager/bilder/ma45/4439452/donaukanal-daemmerung.4ebd99e199.1784955310.jpg","page":"https://www.wien.gv.at/umwelt/donaukanal","caption":"多瑙运河滨水步道、桥梁与露天餐饮，暖季傍晚场景","credit":"Wiener Gewässer (MA 45) / Christian Fürthner"}}],"checklist":[{"id":"passport","group":"出发前","title":"证件与离线备份","detail":"护照、有效签证、保险、酒店/车票留离线副本。订单详情不要放在公开网站；两人各自保存一份。","refs":[]},{"id":"pvg","group":"出发前","title":"9/25 晚去浦东，不是 9/26 晚","detail":"MU8639 为 9/26 凌晨 02:20，出门日期最容易看错。","refs":["bookings"]},{"id":"jeffarrive","group":"先预约","title":"Jeff’s 到店与晚到方案","detail":"告知 9/29 17:24 到站、预计 18 点前后入住。确认晚于 19:00 时如何拿钥匙、早餐时间与是否包含。","refs":["jeffs"]},{"id":"taxiarrival","group":"先预约","title":"预约 9/29 Bad Goisern 站接酒店","detail":"把人数、行李、火车到站时间和 Bachlunzenweg 10 发给出租车；要求列车晚点时可调整。尚未预约。","refs":["taxigoisern"]},{"id":"taxidepart","group":"先预约","title":"预约 10/2 09:00 Jeff’s → Bad Goisern 站","detail":"目标 09:20 到站，09:43 发车。不要当晨才找车。","refs":["taxigoisern","bookings"]},{"id":"restaurants","group":"先预约","title":"只预订关键几顿，不锁死全部天气","detail":"优先 Steegwirt 9/30 或 10/1 18:00 二选一；再考虑 9/27 Stöckl、9/29 Moserwirt、10/2 Strahov。预约均未代为完成。","refs":["steegwirt","stockl","moser","brewery"]},{"id":"cash","group":"出发前","title":"为现金店准备少量欧元","detail":"Weinstube Josefstadt 明确仅收现金。其他消费到店确认支付方式，不因有信用卡就假设处处可刷。","refs":["josef"]},{"id":"maps","group":"出发前","title":"地图与通信","detail":"保存 5 家酒店完整地址与车站名；下载离线地图，确认手机在三国能联网。当地公交还需实时核对。","refs":[]},{"id":"shoes","group":"出发前","title":"防雨、防滑与分层穿衣","detail":"带防雨外层、保暖中层、可走石板路和湖岸的鞋、折叠伞。湖区温度/风雨以出发前预报决定加减衣物。","refs":[]},{"id":"snacks","group":"出发前","title":"火车备用食物","detail":"带水和少量能独立成餐的零食。由中国携入的食品避开肉及肉包；泡面不能只看“风味”字样，要看成分。","refs":["foodimport"]},{"id":"gosaucheck","group":"出发前一晚复查","title":"Gosausee 左岸封闭与回程","detail":"左岸公告到 9/30，10/1 也要确认是否解除；默认开放右岸往返。先找到回程车，再出发。","refs":["gosau","ooevv"]},{"id":"busconfirm","group":"出发前一晚复查","title":"542 必须查本次日期的时刻","detail":"手头官网下载 PDF 是冬季表，不能用于 9/30 或 10/1。填起终点与日期，核对是否在 Steeg-Gosau 换车。","refs":["bus542","ooevv"]},{"id":"luggage","group":"先预约","title":"Lindner 10/4 退房后寄存","detail":"确认可以寄存至 17 点前后，避免全下午拖箱子。未获得酒店确认前，不视为已安排。","refs":["bookings"]},{"id":"ryanair","group":"出发前一晚复查","title":"FR4033 值机、证件与行李额度","detail":"核对实际购买的登机箱/托运行李，在 App 完成要求的非 EU/EEA 证件验证；无法完成则早点去柜台。","refs":["ryanair"]},{"id":"tribelate","group":"先预约","title":"TRIBE 备注 10/4 深夜抵达","detail":"说明航班 22:45 抵达，入住可能 23:30 或午夜后；延误及时更新。","refs":["tribe"]},{"id":"trains","group":"每日复查","title":"列车运行、站台和车厢","detail":"票面时刻与实际运行分开看。短换乘在到站前查下一段站台；有问题先找工作人员，不自行假设车票能换乘任意列车。","refs":["oebb","regiojet"]},{"id":"exports","group":"网站使用","title":"把修改后的攻略分享给同行人","detail":"编辑只存在当前浏览器。用“导出可分享网页”保存新的 HTML，再发给对方；不是云端实时同步。","refs":[]}],"practical":[{"title":"先读：哪些是已确认，哪些仍待落实","items":["酒店、长途交通与座位均按你最新提供的文字保留，未用旧文件反向覆盖。酒店更名也按你确认的名称显示。","所有起床时间、短途车程、到店窗口、步行时长和每人餐饮预算都是规划建议，不是已订接驳或实时保证。","餐厅与景点采用官方公开营业信息；仍可能临时包场、满位、天气停业。这里没有代订任何餐厅、出租车或新门票。","本版不提供未经核实的 542 夏季精确发车时刻，也不声称知道 10/1 左岸一定重开。最重要的待办已单列。"],"refs":["bookings","gosau","bus542"]},{"title":"布达佩斯：机场只选一种简单进城方式","items":["省体力：机场官方 Főtaxi 柜台按酒店地址安排车辆，出发前看清报价/计价；不要把网上旧的固定价格当现价。","省预算：100E 机场快线，官方专用票 2,500 HUF/人，两人 5,000 HUF。到市区站后还有到酒店的一段，普通市内车票不直接适用。","9/27 前往 Kelenföld 优先按“10:40 酒店出发、11:20 到站”留余量；出租车最省搬行李。公共交通要把步行、买票、换乘和站内找车都加进去。"],"refs":["bkk","budtaxi","bookings"]},{"title":"维也纳：别照搬旧的 48/72 小时票攻略","items":["2026 公开价格：数字 24 小时票 €9.70，纸票 €10.20；过去的 48/72 小时产品不再沿用。购票前仍按 App 当日显示核对。","你们周日主要步行，周一才频繁坐车。可考虑周一上午开始一张 24 小时票，覆盖到周二上午；比为了两晚住宿自动买长票更合理。","周日普通零售大多关闭，城市散步和餐饮可以安排，但不要把采购任务全留到抵达日。"],"refs":["wiener","viennashops"]},{"title":"湖区：要把“最后一公里”当成路线的一部分","items":["Jeff’s 官方旅游资料标注火车站约 2 公里。拖箱子不等于轻松散步，因此接站和离站车是优先预约项。","Gosausee 以 Bad Goisern → Steeg-Gosau → 542 的结构查询；旧攻略与季节性时刻变化容易混淆，不能假定从镇上任意公交站直达。","Salzkammergut Shuttle 是指定站点之间的预约服务，不是 €6 随意门到门出租车。至少提前 1 小时；跨多条线路另计，一些平行公交站间在 07:00–18:00 不适用。","公交回程未接上时，有提前预留的车辆联系人比现场盲等末班可靠。湖岸日不要用“最后一班车”作为唯一方案。"],"refs":["jeffsdistance","ooevv","bus542","shuttle","taxigoisern"]},{"title":"布拉格：酒店在城堡区，路线要重新按西侧安排","items":["10/2 从主站到 Lindner，建议第一次带行李打车上去；报价看 App 或正规司机，本站 25–40 分钟级别的接驳预留并非实时车程。","2026 PID App：30 分钟 36 CZK、90 分钟 46 CZK、24 小时 140 CZK、72 小时 340 CZK。纸票依次 39、50、150、350 CZK。以买票界面和启用时间为准。","不要仅凭“两晚”就买 72 小时票。一天短程乘坐 4 次约 144 CZK，24 小时票可能更省；只坐两次则未必。机场长程要按实际所需有效时长选票。","机场公共交通参考 Metro A 到 Nádraží Veleslavín 接 59 路；这是 59，不是旧的 119。你们从酒店出发的第一段要当天查询，不默认这一方案一定比出租车好。"],"refs":["bookings","pid","prgtransport"]},{"title":"预算：先留余量，不把估算当报价","items":["以下是每人规划区间：咖啡/甜点约 €10–20 等值；普通坐下吃饭约 €25–45 等值；Steegwirt 这样的特别一餐可预留 €45–80，不含高价酒。","完整游玩日两人额外消费可先按 €130–220 等值留预算，覆盖一般餐饮、少量市内交通和零星门票；不含已付住宿、长途车票、购物、大量出租车、高山缆车与高价餐。","预算是给取舍用的，不需要为了“用完预算”加活动。真的要额外花钱，优先买接站便利和想吃的一顿饭，而不是不感兴趣的景点套票。","三地付款货币不同：奥地利 EUR、匈牙利 HUF、捷克 CZK；看清菜单、收据与支付币种。信用卡返现活动未在本版重做核验。"],"refs":["bkk","pid","wiener","josef"]},{"title":"坏天气与身体状态：直接换，不补作业","items":["湖区：最好天气给 Gosausee；雨天换 Bad Ischl、Zauner 和 HAND.WERK.HAUS。后者中午 12:00–14:00 休息。","维也纳：周一雨天可用 Leopold；逛馆替换逛街，不是额外加 3 小时。","布拉格：Strahov 图书馆、近处餐厅和咖啡构成半天就够。买普通票前看清书厅权限，不能把网络全景照当作能自由走入的保证。","连续下雨、鞋子湿透或睡眠不足时，把户外压到 30–60 分钟。已有车票决定移动日，未订的景点不必强行完成。"],"refs":["handwerk","leopold","strahov","gosau"]},{"title":"紧急联系与安全","items":["紧急救援：欧盟通用号码 112。非紧急出行问题联系酒店、运营方或当地旅游办公室，不占用紧急线路。","Jeff’s：+43 660 6314777；Goiserer Taxi：+43 6135 4242；Salzkammergut Shuttle：+43 50 422422。","TRIBE：+36 1 2960070。手机保存酒店地址、保险紧急热线与同行人电话；电话拨号链接在住宿页。","湖岸或山地封闭时不越围挡。落石提醒优先于旧游记和导航；不为补全环线冒险。"],"refs":["eu112","jeffs","taxigoisern","shuttle","tribe","gosau"]},{"title":"可复制的英文预约留言","items":["给 Jeff’s：Hi, we’re arriving at Bad Goisern station at 17:24 on September 29 and expect to reach the property around 18:00. Could you confirm the check-in arrangements, what to do if the train is delayed, and your breakfast hours? We leave on October 2 for the 09:43 train. Thank you!","给出租车：Hi, could we book a taxi for two people with luggage from Jeff’s, Bachlunzenweg 10, to Bad Goisern station at 09:00 on October 2? Our train leaves at 09:43. Please confirm availability and the fare. Thank you!","给餐厅：Hi, could we reserve a table for two on [date] at [time]? Please let us know whether you have availability. Thank you!","给 TRIBE：Hi, we’ll arrive on FR4033 from Prague at 22:45 on October 4, so we expect a late check-in around 23:30 or after midnight if delayed. Could you please note this on our booking? Thank you!"],"refs":[]}]}
</script>

<script id="map-app">
"use strict";
const CITY_GUIDES={
  "布达佩斯":{label:"河岸、温泉与街区",intro:"先在多瑙河两岸选想看的风景，再决定要不要加温泉或咖啡。经典地标与安静街区都列出来，取舍由你们定。",hotels:["parisi","tribe"],cover:"bp-palace"},
  "维也纳":{label:"花园、市场与庭院",intro:"以花园、城市散步、小店和好饭为主。艺术馆只保留一个低优先级备选，不需要为了完整打卡去看展。",hotels:["hyatt"],cover:"vi-gardens"},
  "湖区":{label:"湖岸、小镇与山景",intro:"先挑更喜欢哪片湖、愿不愿意爬坡，再安排接驳。这里的点分布很散，地图上的近远比一天塞几个地方更重要。",hotels:["jeffs"],cover:"lk-gosau"},
  "布拉格":{label:"小巷、公园与城市视野",intro:"城堡区小巷、河边地标、生活街区和葡萄园都可以选。先比较你们想要的体验，不必照着某条固定路线走。",hotels:["lindner"],cover:"pr-grebovka"}
};
let cityMap=null;
let cityPlaceMarkers=new Map();
let cityHotelMarkers=new Map();
let highlightedPlaceId=null;
const cityHotelSelection={};
function cityHotels(){return CITY_GUIDES[filter.city].hotels.map(id=>D.hotels.find(h=>h.id===id)).filter(Boolean);}
function activeCityHotel(){const hotels=cityHotels();return hotels.find(h=>h.id===cityHotelSelection[filter.city])||hotels[0];}
function hasCoordinates(p){return Number.isFinite(p?.coordinates?.lat)&&Number.isFinite(p?.coordinates?.lng);}
function removeCityMap(){
  if(cityMap)cityMap.remove();
  cityMap=null;cityPlaceMarkers.clear();cityHotelMarkers.clear();highlightedPlaceId=null;
}
function mapPanel(){
  const hotels=cityHotels(),active=activeCityHotel();
  return `<aside class="map-panel" id="map-panel"><div class="map-panel-head"><div><div class="eyebrow">SEE WHERE THINGS ARE</div><h2>${esc(filter.city)} · 地点地图</h2></div><button class="small" data-action="map-fit">看全区域</button></div><p class="map-help">鼠标移到卡片上高亮位置；点地图上的编号查看对应地点。手机上点卡片的“地图定位”。</p><div class="hotel-selector"><span>已订住宿</span>${hotels.map(h=>`<button data-action="map-hotel" data-hotel="${h.id}" aria-pressed="${h.id===active.id}" class="hotel-pick ${h.id===active.id?"active":""}"><b>H</b><span>${esc(h.name)}<small>${esc(h.nights)}</small></span></button>`).join("")}</div><div id="city-map" aria-label="${esc(filter.city)}景点与酒店地图"><p class="map-loading">正在打开地图……</p></div><p id="map-network-note" class="map-network-note" hidden>底图暂时加载不完整。地点标记仍可查看，也可用卡片上的地图链接。</p><div class="map-legend"><span><i class="legend-place"></i>候选地点</span><span><i class="legend-saved"></i>已收藏</span><span><i class="legend-hotel"></i>酒店</span></div><div id="map-place-info" class="map-place-info" aria-live="polite"><strong>先看看位置，再选喜欢的</strong><p>酒店用 H 标出；收藏不会自动生成路线，也不代表已经预订。</p></div><p class="map-footnote">街区、湖岸和公园的标记是代表位置，不是唯一入口。地图距离感用于筛选，实际交通留到选好后再排。</p></aside>`;
}
function setupCityMap(){
  const target=document.getElementById("city-map");
  if(!target)return;
  if(!window.L){target.innerHTML='<p class="map-loading">地图暂时不可用；地点卡片与外部地图链接仍可使用。</p>';return;}
  target.innerHTML="";
  cityMap=L.map(target,{scrollWheelZoom:false,zoomControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'}).on('tileerror',()=>{const note=document.getElementById('map-network-note');if(note)note.hidden=false;}).addTo(cityMap);

  fitCityMap();

function refreshMapMarkers(){
  if(!cityMap)return;
  for(const marker of [...cityPlaceMarkers.values(),...cityHotelMarkers.values()])marker.remove();
  cityPlaceMarkers.clear();cityHotelMarkers.clear();

    if(!hasCoordinates(p))return;
    const saved=state.favorites.includes(p.id);
    const marker=L.marker([p.coordinates.lat,p.coordinates.lng],{title:p.name,icon:L.divIcon({className:'place-map-icon',html:`<span class="map-pin ${saved?'saved':''}" aria-hidden="true">${i+1}</span>`,iconSize:[32,38],iconAnchor:[16,36]}),zIndexOffset:0});

    marker.on('mouseover',()=>highlightMapPlace(p.id,false));
    marker.on('click',()=>{highlightMapPlace(p.id,false);document.getElementById('place-'+p.id)?.scrollIntoView({behavior:'smooth',block:'center'});});
    marker.addTo(cityMap);
    marker.getElement()?.setAttribute('aria-label',`${i+1}. ${p.name}${saved?'，已收藏':''}`);
    cityPlaceMarkers.set(p.id,marker);
  });
  for(const h of cityHotels()){
    if(!hasCoordinates(h))continue;
    const marker=L.marker([h.coordinates.lat,h.coordinates.lng],{title:h.name,icon:L.divIcon({className:'hotel-map-icon',html:`<span class="hotel-map-pin ${h.id===active.id?'active':''}" aria-hidden="true">H</span>`,iconSize:[38,38],iconAnchor:[19,19]}),zIndexOffset:600}).bindTooltip(`${esc(h.name)} · ${esc(h.nights)}`,{direction:'top',offset:[0,-18]});
    marker.on('click',()=>selectMapHotel(h.id));marker.addTo(cityMap);
    marker.getElement()?.setAttribute('aria-label',`酒店：${h.name}，${h.nights}`);
    cityHotelMarkers.set(h.id,marker);

  if(highlightedPlaceId&&cityPlaceMarkers.has(highlightedPlaceId))highlightMapPlace(highlightedPlaceId,false);
  else{highlightedPlaceId=null;const info=document.getElementById('map-place-info');if(info)info.innerHTML='<strong>先看看位置，再选喜欢的</strong><p>酒店用 H 标出；收藏不会自动生成路线，也不代表已经预订。</p>';}
}
function fitCityMap(){
  if(!cityMap)return;
  const points=[...cityPlaceMarkers.values()].map(m=>m.getLatLng()),hotel=activeCityHotel();
  if(hasCoordinates(hotel))points.push([hotel.coordinates.lat,hotel.coordinates.lng]);
  if(points.length)cityMap.fitBounds(L.latLngBounds(points),{padding:[40,40],maxZoom:14});
  else cityMap.setView([48.2,16.3],6);
}
function highlightMapPlace(id,pan){
  if(currentView!=="explore")return;
  const p=allPlaces().find(p=>p.id===id);
  if(!p)return;
  if(highlightedPlaceId!==id){
    document.getElementById('place-'+highlightedPlaceId)?.classList.remove('map-highlight');
    const old=cityPlaceMarkers.get(highlightedPlaceId);old?.getElement()?.classList.remove('map-highlight');old?.setZIndexOffset(0);old?.closeTooltip();
  }
  highlightedPlaceId=id;
  document.getElementById('place-'+id)?.classList.add('map-highlight');
  const marker=cityPlaceMarkers.get(id),hotel=activeCityHotel();
  if(marker){marker.getElement()?.classList.add('map-highlight');marker.setZIndexOffset(1000);marker.openTooltip();if(pan)cityMap.panInside(marker.getLatLng(),{padding:[45,45],animate:false});}
  let distance='';
  if(cityMap&&hasCoordinates(p)&&hasCoordinates(hotel)){
    const km=cityMap.distance([p.coordinates.lat,p.coordinates.lng],[hotel.coordinates.lat,hotel.coordinates.lng])/1000;
    distance=`<p class="hotel-distance">距 ${esc(hotel.name)} <b>直线约 ${km<1?Math.round(km*1000)+' m':km.toFixed(1)+' km'}</b><small>不是步行或驾车里程；隔河、山路会绕行。</small></p>`;
  }
  const info=document.getElementById('map-place-info');
  if(info)info.innerHTML=`<div class="eyebrow">${esc(p.kind)} · ${esc(p.booking?.status||'预约信息待确认')}</div><strong>${esc(p.name)}</strong><p>${esc(p.intro||p.why)}</p>${p.coordinateNote?`<p class="map-point-note">${esc(p.coordinateNote)}</p>`:""}${distance}<button class="small map-return" data-action="jump" data-target="place-${esc(p.id)}">回到这个地点 ↓</button>${!marker?'<p>此地点坐标尚未确认，未在地图上猜测位置。</p>':''}`;
}
function selectMapHotel(id){
  if(!cityHotels().some(h=>h.id===id))return;
  cityHotelSelection[filter.city]=id;
  document.querySelectorAll('.hotel-pick').forEach(b=>{b.classList.toggle('active',b.dataset.hotel===id);b.setAttribute('aria-pressed',String(b.dataset.hotel===id));});
  refreshMapMarkers();fitCityMap();cityHotelMarkers.get(id)?.openTooltip();
}
function refreshExploreResults(){
  const results=document.getElementById('explore-results');
  if(results)results.innerHTML=resultHTML();
  document.querySelectorAll('[data-category]').forEach(b=>{b.classList.toggle('active',b.dataset.category===filter.category);b.setAttribute('aria-pressed',String(b.dataset.category===filter.category));});

document.addEventListener('pointerover',e=>{
  if(e.pointerType==='touch')return;
  const card=e.target.closest('.explore-results .place-card');
  if(card&&!card.contains(e.relatedTarget))highlightMapPlace(card.dataset.placeId,true);
});
document.addEventListener('focusin',e=>{const card=e.target.closest('.explore-results .place-card');if(card)highlightMapPlace(card.dataset.placeId,true);});

</script>

function download(name,text,type){

  const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();

function exportFavorites(){
  const places=allPlaces().filter(p=>state.favorites.includes(p.id));
  if(!places.length){toast("还没有收藏，先在地点卡片上点 ☆。");return;}
  save();
  const text=s=>String(s??"").replace(/\r\n?/g,"\n").replace(/[\\`*_{}\[\]<>#]/g,"\\$&");
  const link=(label,url)=>`[${text(label)}](<${url}>)`;
  const lines=["# 我的中欧旅行收藏","",`导出时间：${new Date().toLocaleString("zh-CN",{hour12:false})}`,`共 ${places.length} 个收藏地点；这是候选清单，不代表已经预约。`,""];
  for(const city of [...new Set(places.map(p=>p.city))]){
    lines.push(`## ${text(city)}`,"");
    for(const p of places.filter(p=>p.city===city)){
      lines.push(`### ${text(p.name)}`,"",`- 类型：${text(p.kind)}；建议停留：${text(p.time)}；体力：${text(p.effort)}`);
      for(const [label,value] of [["是什么",p.intro],["长什么样",p.appearance],["主要看点",p.highlights?.join("；")],["去了做什么",p.do],["推荐理由",p.why],["建议时段",p.bestTime],["不足与取舍",p.tradeoff],["提醒",p.caution]])if(value)lines.push(`- ${label}：${text(value).replace(/\n/g,"\n  ")}`);
      if(p.booking)lines.push(`- 预约：${text(p.booking.status)}。${text(p.booking.detail)}`,...(p.booking.url?[`- ${link("预约 / 官方说明",p.booking.url)}`]:[]));
      lines.push(`- ${link("地图位置",mapURL(p.map))}`);
      if(p.coordinateNote)lines.push(`- 地图标记说明：${text(p.coordinateNote)}`);
      for(const m of p.relatedMaps||[])lines.push(`- ${link(m.label,mapURL(m.query))}`);
      if(p.photo?.page||p.photoPage)lines.push(`- ${link("实景照片来源",p.photo?.page||p.photoPage)}`);
      if(p.trail){
        lines.push("","**步道资料**","");
        for(const [key,label] of [["distance","距离"],["ascent","累计爬升"],["duration","参考时长"],["difficulty","难度"],["routeType","路线类型"],["terrain","路面"],["note","说明"]])if(p.trail[key])lines.push(`- ${label}：${text(p.trail[key])}`);
      }
      if(state.placeNotes[p.id])lines.push("","**我的备注**","",...text(state.placeNotes[p.id]).split("\n").map(line=>"> "+line));
      const sources=(p.refs||[]).map(id=>D.sources[id]).filter(s=>s?.url);
      if(sources.length)lines.push("","资料来源：",...sources.map(s=>`- ${link(s.label,s.url)}`));
      lines.push("", "---", "");
    }
  }
  download("slow-europe-favorites-"+new Date().toISOString().slice(0,10)+".md",lines.join("\n"),"text/markdown;charset=utf-8");
  toast(`已导出 ${places.length} 个收藏地点和对应备注。`);
}

    if(!confirm("导入将替换此浏览器的收藏、路线和笔记。已导出当前版本备份了吗？"))return;

  else if(action==="restore-route"){
    const {date,route}=editorContext||{};if(!date)return;
    if(confirm("恢复此玩法原始时间表？当天笔记会保留。")){if(state.edits[date])delete state.edits[date][route];save();modal.close();render();toast("已恢复这一玩法的原始时间表。");}
  }
  else if(action==="delete-place"){if(confirm("删除这个个人新增备选？")){state.customPlaces=state.customPlaces.filter(p=>p.id!==b.dataset.place);state.favorites=state.favorites.filter(x=>x!==b.dataset.place);delete state.placeNotes[b.dataset.place];save();render();}}
  else if(action==="lake-swap"){state.routes["2026-09-30"]="c";state.routes["2026-10-01"]="d";save();render();toast("已把湖景玩法移到 10/1。餐厅与车辆预约需要另行调整。");}
  else if(action==="export-favorites")exportFavorites();
  else if(action==="export-json")exportJSON();
  else if(action==="export-html")exportHTML();
  else if(action==="import")document.getElementById("import-file").click();
  else if(action==="print")window.print();
  else if(action==="jump")document.getElementById(b.dataset.target)?.scrollIntoView({behavior:"smooth",block:"start"});
  else if(action==="reset"){
    if(confirm("这会清除本浏览器的个人修改、收藏与笔记。建议先导出备份。确认重置？")){state=normalize({});currentView="overview";currentDay=D.days[0].date;save();render();toast("已恢复原始攻略。");}
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.matches("[data-note-day]")){state.dayNotes[el.dataset.noteDay]=clean(el.value,20000);save();}
  if(el.matches("[data-note-place]")){state.placeNotes[el.dataset.notePlace]=clean(el.value,10000);save();}
  if(el.matches("[data-global-note]")){state.globalNote=clean(el.value,30000);save();}
  if(el.matches('[data-filter="query"]')){filter.query=el.value;refreshExploreResults();}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches("select[data-filter]")){filter[el.dataset.filter]=el.value;refreshExploreResults();}
  if(el.matches("[data-check]")){
    state.checks[el.dataset.check]=el.checked;save();el.closest(".check-row").classList.toggle("done",el.checked);
    const n=D.checklist.filter(i=>state.checks[i.id]).length;
    document.getElementById("check-count").textContent=`${n} / ${D.checklist.length} 项`;
    document.getElementById("check-progress").style.width=(n/D.checklist.length*100)+"%";
  }
  if(el.id==="import-file"){importFile(el.files[0]);el.value="";}
});
document.addEventListener("error",e=>{if(e.target instanceof HTMLImageElement){e.target.hidden=true;e.target.closest(".photo-frame")?.classList.add("image-failed");}},true);
modal.addEventListener("submit",submitEditor);
modal.addEventListener("click",e=>{if(e.target===modal)modal.close();});
render();

</script>
</body>
</html>
